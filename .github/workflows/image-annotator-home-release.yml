name: Release image home links

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# The image home, broad site sync, and converter subpath share one bucket.
concurrency:
  group: images-image-converter-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Verify existing image site and exact source files
        id: target
        shell: bash
        run: |
          set -euo pipefail
          base=infra-aws-static-sites/sites/image-annotator/dist
          test -s "$base/index.html"
          test -s "$base/styles.css"
          python3 - "$base/index.html" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.hrefs.extend(value for name, value in attrs if name == 'href')
          links = Links()
          links.feed(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if '/sort/' not in links.hrefs or 'https://images.aws.shdkej.com/tools/image-converter/' not in links.hrefs:
              raise SystemExit('Both the existing sorter and new converter links are required')
          PY
          aws cloudfront list-distributions --output json > "$RUNNER_TEMP/distributions.json"
          python3 - "$RUNNER_TEMP/distributions.json" <<'PY' > "$RUNNER_TEMP/image-distribution-id"
          import json, sys
          items = json.load(open(sys.argv[1]))['DistributionList'].get('Items', [])
          matches = [d for d in items if 'images.aws.shdkej.com' in d.get('Aliases', {}).get('Items', [])]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one image distribution')
          print(matches[0]['Id'])
          PY
          distribution_id="$(cat "$RUNNER_TEMP/image-distribution-id")"
          aws cloudfront get-distribution-config --id "$distribution_id" --query DistributionConfig --output json > "$RUNNER_TEMP/distribution-config.json"
          python3 - "$RUNNER_TEMP/distribution-config.json" "$distribution_id" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          distribution = json.load(open(sys.argv[1]))
          bucket = 'static-images-aws-shdkej-com'
          origins = {o['Id']: o for o in distribution['Origins']['Items']}
          behaviors = distribution.get('CacheBehaviors', {}).get('Items', [])
          from fnmatch import fnmatchcase
          def origin_for(path):
              match = next((b for b in behaviors if fnmatchcase(path.lstrip('/'), b['PathPattern'].lstrip('/'))), distribution['DefaultCacheBehavior'])
              if match.get('FunctionAssociations', {}).get('Quantity', 0) or match.get('LambdaFunctionAssociations', {}).get('Quantity', 0):
                  raise SystemExit('Unexpected edge rewrite on ' + path)
              return origins[match['TargetOriginId']]
          for path in ('/', '/index.html', '/styles.css'):
              origin = origin_for(path)
              if origin['DomainName'] != bucket + '.s3.ap-northeast-2.amazonaws.com' or origin.get('OriginPath'):
                  raise SystemExit('Unexpected origin for ' + path)
          if distribution.get('DefaultRootObject') != 'index.html':
              raise SystemExit('Unexpected default root object')
          print('bucket=' + bucket)
          print('distribution_id=' + sys.argv[2])
          PY
          bucket=static-images-aws-shdkej-com
          for key in index.html styles.css sort/ tools/image-converter/; do
            aws s3api head-object --bucket "$bucket" --key "$key" --query ContentType --output text > /dev/null
          done
      - name: Publish only the two home objects and verify live
        shell: bash
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
          DISTRIBUTION: ${{ steps.target.outputs.distribution_id }}
        run: |
          set -eEuo pipefail
          base=infra-aws-static-sites/sites/image-annotator/dist
          aws s3api get-object --bucket "$BUCKET" --key index.html "$RUNNER_TEMP/old-index.html" > /dev/null
          aws s3api get-object --bucket "$BUCKET" --key styles.css "$RUNNER_TEMP/old-styles.css" > /dev/null
          old_index_type="$(aws s3api head-object --bucket "$BUCKET" --key index.html --query ContentType --output text)"
          old_styles_type="$(aws s3api head-object --bucket "$BUCKET" --key styles.css --query ContentType --output text)"
          old_index_cache="$(aws s3api head-object --bucket "$BUCKET" --key index.html --query CacheControl --output text)"
          old_styles_cache="$(aws s3api head-object --bucket "$BUCKET" --key styles.css --query CacheControl --output text)"
          rollback_needed=0
          restore() {
            local key="$1" file="$2" type="$3" cache="$4" check="$5"
            local opts=(--content-type "$type")
            if [ "$cache" != None ]; then opts+=(--cache-control "$cache"); fi
            aws s3 cp "$file" "s3://$BUCKET/$key" "${opts[@]}" || return 1
            aws s3api get-object --bucket "$BUCKET" --key "$key" "$check" > /dev/null || return 1
            cmp "$file" "$check"
          }
          on_exit() {
            local code=$?
            trap - EXIT ERR INT TERM
            if [ "$code" -ne 0 ] && [ "$rollback_needed" -eq 1 ]; then
              set +e
              echo '::warning::Home release failed; restoring the previous objects'
              local failed=0
              restore index.html "$RUNNER_TEMP/old-index.html" "$old_index_type" "$old_index_cache" "$RUNNER_TEMP/restore-index.html" || failed=1
              restore styles.css "$RUNNER_TEMP/old-styles.css" "$old_styles_type" "$old_styles_cache" "$RUNNER_TEMP/restore-styles.css" || failed=1
              local rollback_id
              rollback_id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/' '/index.html' '/styles.css' --query 'Invalidation.Id' --output text)" || failed=1
              if [ -n "$rollback_id" ]; then
                aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$rollback_id" || failed=1
              fi
              if [ "$failed" -ne 0 ]; then echo '::error::Rollback incomplete; inspect S3 and CloudFront before retry'; fi
            fi
            exit "$code"
          }
          trap on_exit EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          rollback_needed=1
          aws s3 cp "$base/index.html" "s3://$BUCKET/index.html" --content-type text/html --cache-control 'public,max-age=60'
          aws s3 cp "$base/styles.css" "s3://$BUCKET/styles.css" --content-type text/css --cache-control 'public,max-age=60'
          aws s3api get-object --bucket "$BUCKET" --key index.html "$RUNNER_TEMP/new-index.html" > /dev/null
          aws s3api get-object --bucket "$BUCKET" --key styles.css "$RUNNER_TEMP/new-styles.css" > /dev/null
          cmp "$base/index.html" "$RUNNER_TEMP/new-index.html"
          cmp "$base/styles.css" "$RUNNER_TEMP/new-styles.css"
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/' '/index.html' '/styles.css' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$invalidation_id"
          curl -fsSL https://images.aws.shdkej.com/ -o "$RUNNER_TEMP/live-index.html"
          curl -fsSL https://images.aws.shdkej.com/styles.css -o "$RUNNER_TEMP/live-styles.css"
          cmp "$base/index.html" "$RUNNER_TEMP/live-index.html"
          cmp "$base/styles.css" "$RUNNER_TEMP/live-styles.css"
          curl -fsSL -o /dev/null https://images.aws.shdkej.com/sort/
          curl -fsSL -o /dev/null https://images.aws.shdkej.com/tools/image-converter/
          trap - ERR
          echo "Source $GITHUB_SHA; only index.html and styles.css published; https://images.aws.shdkej.com/" >> "$GITHUB_STEP_SUMMARY"
