name: Release image converter subpath

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read, rehearse, exact-two-key release, or emergency baseline restoration
        required: true
        type: choice
        options: [preflight, rehearse, release, restore]
        default: preflight

permissions:
  id-token: write
  contents: read

concurrency:
  group: images-image-converter-release
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # immutable deployed baseline must be locally available for recovery
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Verify existing image bucket and distribution
        id: target
        run: |
          set -euo pipefail
          aws cloudfront list-distributions --output json > "$RUNNER_TEMP/distributions.json"
          python3 - "$RUNNER_TEMP/distributions.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          items=json.load(open(sys.argv[1]))["DistributionList"].get("Items",[])
          matches=[d for d in items if "images.aws.shdkej.com" in d.get("Aliases",{}).get("Items",[])]
          if len(matches)!=1:
              raise SystemExit("Expected exactly one existing images.aws.shdkej.com distribution")
          d=matches[0]
          bucket="static-images-aws-shdkej-com"
          origins=d["Origins"]["Items"]
          if not any(o["DomainName"].startswith(bucket+".s3") and o["DomainName"].endswith("amazonaws.com") for o in origins):
              raise SystemExit("Existing distribution does not target expected image S3 bucket")
          print("bucket="+bucket)
          print("distribution_id="+d["Id"])
          PY
          aws s3api head-object --bucket static-images-aws-shdkej-com --key sort/index.html --query ContentType --output text > /dev/null
      - name: Read both exact converter objects and versioned recovery sources
        shell: bash
        run: |
          set -euo pipefail
          bucket="${{ steps.target.outputs.bucket }}"
          status="$(aws s3api get-bucket-versioning --bucket "$bucket" --query Status --output text 2>/dev/null || echo Unavailable)"
          echo "Bucket versioning status: $status"
          for key in tools/image-converter/index.html tools/image-converter/; do
            label=index
            if [ "$key" = tools/image-converter/ ]; then label=slash; fi
            dir="$RUNNER_TEMP/converter-$label"
            mkdir -m 700 "$dir"
            aws s3api head-object --bucket "$bucket" --key "$key" > "$dir/head.json"
            aws s3api get-object --bucket "$bucket" --key "$key" "$dir/current.html" > "$dir/get.json"
            python3 - "$dir" "$key" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          d=Path(sys.argv[1]); key=sys.argv[2]
          head=json.loads((d/'head.json').read_text()); got=json.loads((d/'get.json').read_text())
          body=(d/'current.html').read_bytes()
          if not body or len(body)!=head['ContentLength'] or head.get('VersionId') != got.get('VersionId'):
              raise SystemExit('Object length/version mismatch: '+key)
          version=head.get('VersionId')
          print(f'{key}: HEAD+GET verified; sha256={hashlib.sha256(body).hexdigest()}; version_available={bool(version and version != "null")}; metadata_fields={sorted(head.keys())}')
          (d/'version.txt').write_text(version or '')
          PY
            version="$(cat "$dir/version.txt")"
            if [ "$status" = Enabled ] && [ -n "$version" ] && [ "$version" != null ]; then
              aws s3api get-object --bucket "$bucket" --key "$key" --version-id "$version" "$dir/version.html" > "$dir/version.json"
              cmp "$dir/current.html" "$dir/version.html"
              echo "$key: GetObjectVersion body matches current"
            else
              echo "$key: durable version recovery unavailable"
            fi
          done
      - name: Verify reproducible baseline and exact restore metadata
        env:
          POSTHOG_MINIAPP_PROJECT_TOKEN: ${{ secrets.POSTHOG_MINIAPP_PROJECT_TOKEN }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git show 3b9faeef227d97e48b3dfe42b71894ee0d738e7b:infra-aws-static-sites/sites/miniapp-image-tools/dist/index.html > "$RUNNER_TEMP/baseline-source.html"
          python3 - "$RUNNER_TEMP" <<'PY'
          import hashlib,json,os,re,sys
          from pathlib import Path
          root=Path(sys.argv[1]); token=os.environ.get('POSTHOG_MINIAPP_PROJECT_TOKEN','')
          if not re.fullmatch(r'phc_[A-Za-z0-9]+',token): raise SystemExit('Existing browser project token unavailable')
          source=(root/'baseline-source.html').read_text()
          marker='__POSTHOG_MINIAPP_PROJECT_TOKEN__'
          if source.count(marker)!=1: raise SystemExit('Baseline placeholder count mismatch')
          baseline=source.replace(marker,token).encode()
          expected='054deb7b1acfae3e54424651208168720b3dfe850b22a5138e014e1b8563de3f'
          if hashlib.sha256(baseline).hexdigest()!=expected: raise SystemExit('Immutable baseline reconstruction hash mismatch')
          for label in ('index','slash'):
              d=root/('converter-'+label)
              head=json.loads((d/'head.json').read_text())
              current=(d/'current.html').read_bytes()
              if os.environ['RELEASE_MODE']!='restore' and hashlib.sha256(current).hexdigest()!=expected: raise SystemExit('Current object is not baseline: '+label)
              if head.get('ContentType')!='text/html' or head.get('CacheControl')!='public,max-age=60' or head.get('Metadata')!={} or head.get('ServerSideEncryption')!='AES256':
                  raise SystemExit('Unexpected metadata; cannot reproduce exactly: '+label)
          (root/'baseline.html').write_bytes(baseline)
          print('Immutable baseline reconstructed; both target restore headers verified; baseline-current equality required except in restore mode')
          PY
      - name: Rehearse or restore baseline on both exact keys and read back
        if: ${{ inputs.mode == 'rehearse' || inputs.mode == 'restore' }}
        shell: bash
        run: |
          set -euo pipefail
          bucket="${{ steps.target.outputs.bucket }}"
          distribution="${{ steps.target.outputs.distribution_id }}"
          for key in tools/image-converter/index.html tools/image-converter/; do
            label=index
            if [ "$key" = tools/image-converter/ ]; then label=slash; fi
            aws s3api put-object --bucket "$bucket" --key "$key" --body "$RUNNER_TEMP/baseline.html" --content-type text/html --cache-control 'public,max-age=60' --server-side-encryption AES256 > /dev/null
            aws s3api get-object --bucket "$bucket" --key "$key" "$RUNNER_TEMP/rehearsed-$label.html" > /dev/null
            cmp "$RUNNER_TEMP/baseline.html" "$RUNNER_TEMP/rehearsed-$label.html"
            aws s3api head-object --bucket "$bucket" --key "$key" > "$RUNNER_TEMP/rehearsed-$label.json"
            python3 - "$RUNNER_TEMP/rehearsed-$label.json" <<'PY'
          import json,sys
          h=json.load(open(sys.argv[1]))
          if (h.get('ContentType'),h.get('CacheControl'),h.get('Metadata'),h.get('ServerSideEncryption')) != ('text/html','public,max-age=60',{},'AES256'):
              raise SystemExit('Restored metadata mismatch')
          PY
            echo "$key: identical-content PutObject, GetObject, HEAD and metadata verified"
          done
          id="$(aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/tools/image-converter/' '/tools/image-converter/index.html' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$distribution" --id "$id"
          echo "Exact two-path invalidation complete: $id"
      - name: Upload only image converter objects
        if: ${{ inputs.mode == 'release' }}
        env:
          POSTHOG_MINIAPP_PROJECT_TOKEN: ${{ secrets.POSTHOG_MINIAPP_PROJECT_TOKEN }}
          BUCKET: ${{ steps.target.outputs.bucket }}
          DISTRIBUTION: ${{ steps.target.outputs.distribution_id }}
        run: |
          set -eEuo pipefail
          file=infra-aws-static-sites/sites/miniapp-image-tools/dist/index.html
          test -s "$file"
          node --test infra-aws-static-sites/sites/miniapp-image-tools/tests/*.test.mjs
          python3 - "$file" "$RUNNER_TEMP/image-converter.html" <<'PY'
          import os,re,sys
          from pathlib import Path
          token=os.environ.get('POSTHOG_MINIAPP_PROJECT_TOKEN','')
          if not re.fullmatch(r'phc_[A-Za-z0-9]+',token):
              raise SystemExit('PostHog project token missing or malformed')
          source=Path(sys.argv[1]).read_text()
          marker='__POSTHOG_MINIAPP_PROJECT_TOKEN__'
          if source.count(marker)!=1:
              raise SystemExit('Expected exactly one PostHog token placeholder')
          Path(sys.argv[2]).write_text(source.replace(marker,token))
          PY
          file="$RUNNER_TEMP/image-converter.html"
          rollback_needed=0
          recover() {
            local failed=0 id='' key label
            set +e
            echo '::warning::Release interrupted; restoring both exact keys from verified immutable baseline'
            for key in tools/image-converter/index.html tools/image-converter/; do
              label=index
              if [ "$key" = tools/image-converter/ ]; then label=slash; fi
              aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$RUNNER_TEMP/baseline.html" --content-type text/html --cache-control 'public,max-age=60' --server-side-encryption AES256 > /dev/null || failed=1
              aws s3api get-object --bucket "$BUCKET" --key "$key" "$RUNNER_TEMP/rollback-$label.html" > /dev/null && cmp "$RUNNER_TEMP/baseline.html" "$RUNNER_TEMP/rollback-$label.html" || failed=1
              aws s3api head-object --bucket "$BUCKET" --key "$key" > "$RUNNER_TEMP/rollback-$label.json" || failed=1
              if [ -s "$RUNNER_TEMP/rollback-$label.json" ]; then
                python3 - "$RUNNER_TEMP/rollback-$label.json" <<'PY' || failed=1
          import json,sys
          h=json.load(open(sys.argv[1]))
          assert (h.get('ContentType'),h.get('CacheControl'),h.get('Metadata'),h.get('ServerSideEncryption')) == ('text/html','public,max-age=60',{},'AES256')
          PY
              fi
            done
            id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/tools/image-converter/' '/tools/image-converter/index.html' --query 'Invalidation.Id' --output text)" || failed=1
            if [ -n "$id" ]; then aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id" || failed=1; fi
            if [ "$failed" -eq 0 ]; then echo 'Both original object bodies and headers restored; invalidation completed'; else echo '::error::Rollback incomplete; dispatch mode=restore after run exit'; fi
            return "$failed"
          }
          on_exit() {
            local code=$?
            trap - EXIT ERR INT TERM
            if [ "$code" -ne 0 ] && [ "$rollback_needed" -eq 1 ]; then recover || true; fi
            exit "$code"
          }
          trap on_exit EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          rollback_needed=1
          for key in tools/image-converter/index.html tools/image-converter/; do
            label=index
            if [ "$key" = tools/image-converter/ ]; then label=slash; fi
            aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$file" --content-type text/html --cache-control 'public,max-age=60' --server-side-encryption AES256 > /dev/null
            aws s3api get-object --bucket "$BUCKET" --key "$key" "$RUNNER_TEMP/released-$label.html" > /dev/null
            cmp "$file" "$RUNNER_TEMP/released-$label.html"
            aws s3api head-object --bucket "$BUCKET" --key "$key" > "$RUNNER_TEMP/released-$label.json"
            python3 - "$RUNNER_TEMP/released-$label.json" <<'PY'
          import json,sys
          h=json.load(open(sys.argv[1]))
          assert (h.get('ContentType'),h.get('CacheControl'),h.get('Metadata'),h.get('ServerSideEncryption')) == ('text/html','public,max-age=60',{},'AES256')
          PY
            echo "$key: new body and metadata read back"
          done
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/tools/image-converter/' '/tools/image-converter/index.html' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
          for path in /tools/image-converter/ /tools/image-converter/index.html; do
            label=index
            if [ "$path" = /tools/image-converter/ ]; then label=slash; fi
            curl -fsSL "https://images.aws.shdkej.com$path" -o "$RUNNER_TEMP/live-$label.html"
            cmp "$file" "$RUNNER_TEMP/live-$label.html"
          done
          rollback_needed=0
          echo "Exact two-path release and invalidation $id verified; source file from $GITHUB_SHA (b8ee2e45 content)" >> "$GITHUB_STEP_SUMMARY"
