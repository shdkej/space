name: Publish k3s analytics feeds
on:
  schedule:
    - cron: "30 1,3 * * *"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: public-analytics-s3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - run: pip install --quiet boto3
      - run: python3 infra-aws-static-sites/sites/status/scripts/publish-public.py
