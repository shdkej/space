apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-metrics
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: agent-metrics-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Agent Metrics"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [metrics.oracle.shdkej.com]
      secretName: agent-metrics-tls
  rules:
    - host: metrics.oracle.shdkej.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-metrics
                port: {number: 80}
