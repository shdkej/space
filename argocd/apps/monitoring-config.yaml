# Monitoring GitOps 연결: Space는 kube-prometheus-stack 기반을 소유하고,
# monitoring_personal은 아래 CRD·ConfigMap·exporter 리소스의 소스 정본을 소유한다.
# - PrometheusRule / AlertmanagerConfig / ServiceMonitor
# - Grafana datasource·dashboard ConfigMap과 exporter Deployment/Service
# Docker/Compose는 운영 경로가 아니다. monitoring_personal push 후 이 앱의
# Synced/Healthy revision과 Prometheus·Grafana 결과를 검증한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shdkej/monitoring_personal.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
