apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: public-analytics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shdkej/space.git
    targetRevision: main
    path: infra-aws-static-sites/sites/status/scripts
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
