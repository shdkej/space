<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffdf2" />
    <title>사진 보관함 · Clef</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PHOTO LIBRARY</p>
          <h1>사진 보관함</h1>
          <p class="lede">Clef로 사진을 정리하고, 기억할 맥락은 메모로 남겨두세요.</p>
        </div>
        <a class="primary-action" href="/sort/">사진 추가·정리 <span>· Clef</span><span aria-hidden="true">↗</span></a>
      </header>

      <section class="toolbar" aria-label="이미지 필터와 보기 방식">
        <label class="search"><span>찾기</span><input id="search" type="search" placeholder="파일 경로 또는 주석으로 찾기" /></label>
        <div class="toolbar-actions">
          <div class="view-switcher" role="tablist" aria-label="보기 방식">
            <button class="view-button is-active" type="button" role="tab" aria-selected="true" data-view="gallery">목록</button>
            <button class="view-button" type="button" role="tab" aria-selected="false" data-view="map">지도</button>
          </div>
          <button class="quiet-button" id="refresh" type="button">새로고침</button>
        </div>
      </section>

      <div class="library-meta">
        <div class="status" id="status" aria-live="polite">이미지를 불러오는 중</div>
        <p class="interaction-hint">한 번 누르면 링크 복사 · 두 번 누르면 메모</p>
      </div>

      <section class="content-grid">
        <div class="gallery" id="gallery" aria-live="polite"></div>
        <div class="map-view" id="map-view" aria-live="polite" hidden></div>
      </section>
    </main>
    <dialog class="note-dialog" id="note-dialog" aria-labelledby="note-title">
      <form class="note-form" id="note-form" method="dialog">
        <div class="dialog-head"><div><p class="dialog-kicker">IMAGE NOTE</p><h2 id="note-title">주석 수정</h2><p class="dialog-description">이 사진에 남겨둘 맥락을 짧게 적어두세요.</p></div><button class="dialog-close" id="dialog-close" type="button" aria-label="주석 창 닫기">×</button></div>
        <img class="dialog-image" id="note-image" alt="" />
        <label class="note-label" for="note-input">주석</label>
        <textarea class="note-input" id="note-input" maxlength="10000" placeholder="왜 남겼는지, 어디에 쓸지, 다음에 기억할 것을 적어보세요."></textarea>
        <div class="save-row"><span class="save-message" id="note-save-message" aria-live="polite"></span><button class="save-button" type="submit">주석 저장</button></div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
