    async function openDetailModal(item, sourceLabel) {
      const runId = ++detailRenderRun;
      detailTitle.textContent = item.id ? "[" + item.id + "] " + item.title : item.title;
      detailBody.replaceChildren();
      detailModal.classList.add("open");
      detailModal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");

      renderImmediateDetail(item, sourceLabel);
      const loadingEl = document.createElement("div");
      loadingEl.className = "detail-loading";
      loadingEl.textContent = "원문과 리포트를 불러오는 중…";
      detailBody.appendChild(loadingEl);

      try {
        const bundle = await loadDetailBundle(item);
        if (runId !== detailRenderRun) return;
        loadingEl.remove();
        appendLoadedDetail(item, bundle);
      } catch (e) {
        if (runId !== detailRenderRun) return;
        loadingEl.remove();
        addDetailBlock("상세 로딩 실패", e.message || String(e), "kind-empty");
      }
    }

    // markdown 의 ## 헤더 단위로 잘라 { name: body } 맵 반환
    function splitSections(md) {
      const lines = md.split(/\r?\n/);
      const sections = {};
      let current = "__preamble__";
      sections[current] = [];
      for (const line of lines) {
        const m = line.match(/^##\s+(.+?)\s*$/);
        if (m) {
          current = m[1].trim();
          if (!sections[current]) sections[current] = [];
          else sections[current].push("<!-- duplicate section merged by dashboard -->");
        } else {
          sections[current].push(line);
        }
      }
      for (const k of Object.keys(sections)) sections[k] = sections[k].join("\n");
      return sections;
    }

    // ### [id] title 헤더 단위로 항목 추출
    function parseItems(body) {
      if (!body) return [];
      const lines = body.split(/\r?\n/);
      const items = [];
      let cur = null;
      for (const line of lines) {
        const m = line.match(/^###\s+(.+?)\s*$/);
        if (m) {
          if (cur) items.push(cur);
          const heading = m[1].trim();
          const idm = heading.match(/^\[([^\]]+)\]\s*(.*)$/);
          cur = {
            id: idm ? idm[1] : "",
            title: idm ? idm[2] : heading,
            bodyLines: [],
            meta: {},
          };
        } else if (cur) {
          cur.bodyLines.push(line);
          // bullet meta: "- key: value" (키의 공백/하이픈은 snake_case로 정규화 — 구식 표기 호환)
          const bm = line.match(/^\s*-\s+([a-zA-Z_][a-zA-Z_ -]{0,30}?)\s*:\s*(.+?)\s*$/);
          if (bm) cur.meta[bm[1].toLowerCase().trim().replace(/[ -]+/g, "_")] = bm[2];
        }
      }
      if (cur) items.push(cur);
      return items;
    }

    // INTENTS.md Archive 섹션 안의 완료 코멘트를 archive 항목으로 추출.
    // 코멘트 포맷 예: "marketing-01 completed 2026-05-16T06:14Z → intents/archive/marketing-01.md (Virtue 배포/검증 완료)"
    // 괄호 안의 outcome 텍스트를 카드 요약(title)으로 사용해 한눈에 결과가 보이도록 한다.
    function parseArchiveComments(activeBody) {
      if (!activeBody) return [];
      const re = /<!--\s*([\s\S]+?)\s*-->/g;
      const out = [];
      let m;
      while ((m = re.exec(activeBody)) !== null) {
        const text = m[1].trim();
        const idm = text.match(/^([a-z][a-z0-9]*(?:-[a-z0-9]+)*-\d+)\b/);
        const dtm = text.match(/(\d{4}-\d{2}-\d{2}(?:[T\s](?:\d{2}:\d{2}(?::\d{2})?|\d{4}(?:\d{2})?)Z?)?)/);
        const statm = text.match(/\b(completed|resolved|done|archived|closed|canceled|cancelled|rejected|approved|failed)\b/i);
        const pathm = text.match(/(?:→|->)\s*([^\s)]+\.md)/);
        const parenm = text.match(/\(([^()]+)\)\s*$/);
        const outcome = parenm ? parenm[1].trim() : "";
        let cleaned = text
          .replace(/^([a-z][a-z0-9]*(?:-[a-z0-9]+)*-\d+)\s*/, "")
          .replace(/(?:→|->)\s*\S+/g, "")
          .replace(/\([^()]+\)\s*$/, "")
          .replace(/\b(completed|resolved|done|archived|closed|canceled|cancelled|rejected|approved|failed)\b/gi, "")
          .replace(/\d{4}-\d{2}-\d{2}(?:[T\s](?:\d{2}:\d{2}(?::\d{2})?|\d{4}(?:\d{2})?)Z?)?/g, "")
          .replace(/\s{2,}/g, " ")
          .trim();
        const title = outcome || cleaned || text;
        const tagMeta = { ...inferTagMeta(text, idm ? idm[1] : ""), ...extractTagMeta(text) };
        const templateMeta = extractArchiveTemplate(text);
        out.push({
          id: idm ? idm[1] : "",
          title,
          bodyLines: [text],
          meta: {
            status: statm ? statm[1].toLowerCase() : "completed",
            completed_at: dtm ? dtm[1] : "",
            detail: pathm ? pathm[1] : "",
            outcome,
            ...tagMeta,
            ...templateMeta,
          },
          source: "INTENTS.md archive",
        });
      }
      return out;
    }

    // INTENTS.md 의 Inbox/Active/Waiting 요약 코멘트를 카드로 추출
    function parseIntentComments(body, lane) {
      if (!body) return [];
      const re = /<!--\s*([\s\S]+?)\s*-->/g;
      const out = [];
      let m;
      while ((m = re.exec(body)) !== null) {
        const text = m[1];
        const idm = text.match(/^([a-z][a-z0-9]*(?:-[a-z0-9]+)*-\d+)\b/);
        if (!idm) continue;
        if (/\b(completed|resolved|done|archived|closed|canceled|cancelled|rejected|approved|failed)\b/i.test(text)) {
          continue;
        }
        const dtm = text.match(/(\d{4}-\d{2}-\d{2}(?:[T\s](?:\d{2}:\d{2}(?::\d{2})?|\d{4}(?:\d{2})?)Z?)?)/);
        const pathm = text.match(/(?:Report|Detail|상세|리포트)\s*:\s*([^\s)]+\.md)/i)
          || text.match(/(?:→|->)\s*([^\s)]+\.md)/);
        const titlem = text.match(/(?:^|\n)(?:제목|title)\s*:\s*(.+)/i)
          || text.match(/\(([^)]+)\)\s*$/);
        const tagMeta = { ...inferTagMeta(text, idm[1]), ...extractTagMeta(text) };
        out.push({
          id: idm[1],
          title: titlem ? titlem[1].trim() : text,
          bodyLines: [text],
          meta: {
            status: lane,
            created: dtm ? dtm[1] : "",
            detail: pathm ? pathm[1] : "",
            ...tagMeta,
          },
          source: "INTENTS.md comment",
        });
      }
      return out;
    }

    function mergeById(primary, secondary) {
      const seen = new Set(primary.map(x => x.id).filter(Boolean));
      const merged = primary.slice();
      for (const item of secondary) {
        if (item.id && seen.has(item.id)) continue;
        if (item.id) seen.add(item.id);
        merged.push(item);
      }
      return merged;
    }

    function snippetFromBody(lines) {
      const cleaned = lines
        .filter(l => l.trim() !== "")
        .filter(l => !/^\s*-\s+(id|status|priority|permission|created|completed_at|updated|resolved|requested|decision)\b/i.test(l))
        .slice(0, 4)
        .join("\n");
      return cleaned;
    }

    function pickUpdated(item) {
      return item.meta.updated
          || item.meta.completed_at
          || item.meta.resolved
          || item.meta.created
          || item.meta.requested
          || "";
    }

    // 카드가 현재 레인에 며칠째 있는지. 날짜를 못 읽으면 null.
    function ageDays(item, nowMs) {
      const t = parseDateMs(pickUpdated(item));
      if (isNaN(t)) return null;
      return Math.max(0, Math.floor((nowMs - t) / 86400000));
    }

    function splitTagList(value) {
      if (!value) return [];
      return String(value)
        .replace(/^\[|\]$/g, "")
        .split(/[,/|]/)
        .map(x => x.trim().replace(/^["'`]|["'`]$/g, ""))
        .filter(Boolean);
    }

    function splitDecisionOptions(value) {
      if (!value) return [];
      return String(value)
        .split(/\s*(?:\||\/|,|·)\s*/)
        .map(x => x.trim().replace(/^["'`]|["'`]$/g, ""))
        .filter(Boolean);
    }

    function pickDecisionQuestion(item) {
      return (item.meta && (item.meta.decision || item.meta.judgment || item.meta.question)) || "";
    }

    function extractTagMeta(text) {
      const meta = {};
      const projects = text.match(/\bprojects?\s*:\s*([^\];)\n]+)/i);
      const type = text.match(/\b(?:task_type|type)\s*:\s*([a-z0-9_-]+)/i);
      const topics = text.match(/\btopics?\s*:\s*([^\];)\n]+)/i);
      const decision = text.match(/\b(?:decision|judgment|question)\s*:\s*([^\];)\n]+)/i);
      const options = text.match(/\boptions?\s*:\s*([^\];)\n]+)/i);
      const defaultValue = text.match(/\bdefault\s*:\s*([^\];)\n]+)/i);
      const reason = text.match(/\breason\s*:\s*([^\];)\n]+)/i);
      const next = text.match(/\bnext\s*:\s*([^\];)\n]+)/i);
      if (projects) meta.projects = splitTagList(projects[1]);
      if (type) meta.task_type = type[1].trim();
      if (topics) meta.topics = splitTagList(topics[1]);
      if (decision) meta.decision = decision[1].trim();
      if (options) meta.options = options[1].trim();
      if (defaultValue) meta.default = defaultValue[1].trim();
      if (reason) meta.reason = reason[1].trim();
      if (next) meta.next = next[1].trim();
      return meta;
    }

    function inferTagMeta(text, id) {
      const lower = String(text || "").toLowerCase();
      const prefix = String(id || "").split("-")[0];
      const projects = [];
      const topics = [];
      let task_type = "";

      if (lower.includes("virtue") || lower.includes("덕 쌓기")) projects.push("virtue");
      if (lower.includes("infinity")) projects.push("infinity");
      if (lower.includes("agent-wiki") || lower.includes("agent wiki")) projects.push("agent-wiki");
      if (lower.includes("knowledge lab") || lower.includes("knowledge-lab")) projects.push("knowledge-lab");
      if (lower.includes("openclaw")) projects.push("openclaw");
      if (lower.includes("/home/ubuntu/workspace/space") || lower.includes("infra-aws-static-sites") || lower.includes("travel.aws.shdkej.com") || lower.includes("static site")) projects.push("space");
      if (lower.includes("monitoring_personal") || lower.includes("/home/ubuntu/workspace/monitoring_personal") || lower.includes("posthog exporter") || lower.includes("prometheus") || lower.includes("loki") || lower.includes("promtail") || lower.includes("yace")) projects.push("monitoring_personal");
      if (lower.includes("github actions") || lower.includes("kubernetes") || lower.includes("배포")) projects.push("infrastructure");

      if (prefix === "research") task_type = "research";
      else if (prefix === "marketing") task_type = "strategy";
      else if (prefix === "product" || prefix === "build" || prefix === "pages") task_type = "implementation";
      else if (prefix === "wiki") task_type = "maintenance";
      else if (prefix === "monitor") task_type = "monitoring";
      else if (prefix === "maintenance") task_type = "maintenance";

      if (prefix === "marketing") topics.push("marketing");
      if (lower.includes("activation") || lower.includes("활성화")) topics.push("activation");
      if (lower.includes("retention") || lower.includes("리텐션")) topics.push("retention");
      if (lower.includes("analytics") || lower.includes("posthog") || lower.includes("계측")) topics.push("analytics");
      if (lower.includes("workflow") || lower.includes("워크플로우")) topics.push("workflow");
      if (lower.includes("dashboard") || lower.includes("대시보드")) topics.push("dashboard");
      if (lower.includes("wiki")) topics.push("wiki");
      if (lower.includes("ai ") || lower.includes("llm") || lower.includes("agent")) topics.push("ai-agents");

      const uniq = xs => Array.from(new Set(xs)).slice(0, 3);
      const meta = {};
      const inferredProjects = uniq(projects);
      const inferredTopics = uniq(topics);
      if (inferredProjects.length) meta.projects = inferredProjects;
      if (task_type) meta.task_type = task_type;
      if (inferredTopics.length) meta.topics = inferredTopics;
      return meta;
    }

    function allTags(item) {
      const meta = item.meta || {};
      return [
        ...(Array.isArray(meta.projects) ? meta.projects : splitTagList(meta.projects)),
        meta.task_type || "",
        ...(Array.isArray(meta.topics) ? meta.topics : splitTagList(meta.topics)),
      ].filter(Boolean);
    }

    function primaryProject(item) {
      const projects = Array.isArray(item.meta.projects) ? item.meta.projects : splitTagList(item.meta.projects);
      return projects[0] || "";
    }

    function shortText(text, max) {
      const s = String(text || "").replace(/\s+/g, " ").trim();
      if (!s) return "";
      return s.length > max ? s.slice(0, max - 1) + "…" : s;
    }

    function normalizeArchiveValue(text) {
      return String(text || "").replace(/\s+/g, " ").trim();
    }

    function labeledArchiveField(text, label) {
      const lines = String(text || "").split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        const m = lines[i].match(/^\[([^\]]+)\]\s*(.*)$/);
        if (!m || m[1].trim() !== label) continue;
        if (m[2].trim()) return normalizeArchiveValue(m[2]);
        const values = [];
        for (let j = i + 1; j < lines.length; j++) {
          if (/^\[[^\]]+\]/.test(lines[j])) break;
          if (/^##\s+/.test(lines[j])) break;
          if (lines[j].trim()) values.push(lines[j].trim());
        }
        return normalizeArchiveValue(values.join(" "));
      }
      return "";
    }

    function bulletArchiveField(text, key) {
      const source = String(text || "");
      const re = new RegExp("^\\s*-\\s*" + key.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\$&") + "\\s*:\\s*(.+?)\\s*$", "mi");
      const m = source.match(re);
      return m ? normalizeArchiveValue(m[1]) : "";
    }

    function extractArchiveTemplate(text) {
      const source = String(text || "");
      return {
        archive_project: labeledArchiveField(source, "프로젝트") || bulletArchiveField(source, "archive_project"),
        archive_state: labeledArchiveField(source, "상태") || bulletArchiveField(source, "archive_state"),
        result_criteria: labeledArchiveField(source, "결과 기준") || bulletArchiveField(source, "result_criteria"),
        next_action: labeledArchiveField(source, "다음 행동") || bulletArchiveField(source, "next_action"),
      };
    }

    function hasArchiveTemplate(meta) {
      return !!(meta && (meta.archive_project || meta.archive_state || meta.result_criteria || meta.next_action));
    }

    function archiveTemplateFields(item) {
      const meta = item.meta || {};
      const project = meta.archive_project || meta.display || primaryProject(item) || "";
      const state = meta.archive_state || meta.archive_status || "";
      const result = meta.result_criteria || meta.success_criteria || "";
      const next = meta.next_action || meta.next || "";
      return [
        ["프로젝트", project, ""],
        ["상태", state, ""],
        ["결과 기준", result, ""],
        ["다음 행동", next, "next"],
      ].filter(row => row[1]);
    }

    function archiveOutcome(item) {
      return (item.meta && item.meta.outcome) || item.title || snippetFromBody(item.bodyLines) || "";
    }

    function inferArchiveRule(item) {
      const text = archiveOutcome(item);
      const lower = text.toLowerCase();
      const tags = allTags(item).map(x => String(x).toLowerCase());
      if (/공식|사례|근거|source|evidence/.test(text)) {
        return "공식 근거와 공개 사례를 한 쌍으로 남겨 다음 판단의 출처를 바로 재사용한다.";
      }
      if (/red|검증|pass|gate|게이트/.test(lower + " " + text)) {
        return "완료 처리 전 Red·게이트·원격 확인을 한 묶음으로 닫는다.";
      }
      if (tags.includes("dashboard") || /대시보드|화면|ui|배포/.test(text)) {
        return "화면 변경은 구조 의도, 반응형 확인, 라이브 반영을 같은 완료 조건으로 본다.";
      }
      if (/마케팅|콘텐츠|threads|instagram|hook|카드뉴스/.test(lower + " " + text)) {
        return "콘텐츠 산출물은 첫 줄, 근거, 실행 루틴, 측정 신호를 함께 남긴다.";
      }
      if (/cron|automation|자동화|dispatcher|heartbeat/.test(lower + " " + text)) {
        return "반복 운영은 문서보다 스크립트와 검증 명령으로 재현 가능하게 고정한다.";
      }
      return "완료 요약에 닫은 문제와 다음 첫 액션을 같이 남긴다.";
    }

    function inferArchiveNext(item) {
      const text = archiveOutcome(item);
      const lower = text.toLowerCase();
      const project = primaryProject(item);
      if (/sharelink|threads|affiliate|쉐어링크/.test(lower + " " + text)) {
        return "여행 짐 줄이기 생활템 7일 파일럿으로 이어갈 수 있다.";
      }
      if (/dashboard|대시보드/.test(lower + " " + text)) {
        return "다음 화면 변경은 Archive Memory에서 재사용 규칙이 읽히는지 확인한다.";
      }
      if (/card-news|카드뉴스|instagram|threads/.test(lower + " " + text)) {
        return "다음 콘텐츠는 저장·답글·클릭 중 어떤 신호를 볼지 먼저 정한다.";
      }
      if (/cron|dispatcher|heartbeat|자동화/.test(lower + " " + text)) {
        return "다음 사이클에서 같은 실패가 조용히 반복되는지 확인한다.";
      }
      if (project) return project + "의 다음 실행 후보를 Inbox로 승격할지 확인한다.";
      return "후속 작업이 있으면 Inbox 후보로 올리고, 없으면 규칙만 남긴다.";
    }

    function renderArchiveMemory(items) {
      const host = document.getElementById("archive-memory");
      if (!host) return;
      const sorted = sortDoneByCompletionDesc(items);
      const latest = sorted[0];
      if (!latest) {
        host.hidden = true;
        return;
      }
      const nowMs = Date.now();
      const weekDone = sorted.filter(it => {
        const t = parseDateMs(pickCompleted(it));
        return !isNaN(t) && t <= nowMs && t >= nowMs - 7 * 86400000;
      }).length;
      const set = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      };
      set("archive-memory-count", weekDone + " this week · " + sorted.length + " total");
      const latestFields = archiveTemplateFields(latest);
      const latestProject = latestFields.find(row => row[0] === "프로젝트");
      const latestState = latestFields.find(row => row[0] === "상태");
      set("archive-memory-latest", shortText([
        latest.id || "",
        latestProject ? latestProject[1] : archiveOutcome(latest),
        latestState ? latestState[1] : "",
      ].filter(Boolean).join(" — "), 130));
      set("archive-memory-rule", inferArchiveRule(latest));
      const nextField = latestFields.find(row => row[0] === "다음 행동");
      set("archive-memory-next", nextField ? nextField[1] : inferArchiveNext(latest));
      host.hidden = false;
    }

    // Archive 컬럼 정렬용: completed_at / resolved 를 updated 보다 우선
    function pickCompleted(item) {
      return item.meta.completed_at
          || item.meta.archived_at
          || item.meta.resolved
          || item.meta.updated
          || item.meta.created
          || item.meta.requested
          || "";
    }

    // "YYYY-MM-DD" / "YYYY-MM-DDTHH:mm" / "YYYY-MM-DD HH:mm" / "YYYY-MM-DDTHHmmssZ" 등 허용.
    // 파싱 실패 시 NaN 반환 → 비교에서 가장 뒤로 밀림.
    function parseDateMs(s) {
      if (!s) return NaN;
      const t = String(s).trim().replace(/^["'`]|["'`]$/g, "");
      const m = t.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](?:(\d{2}):(\d{2})(?::(\d{2}))?|(\d{2})(\d{2})(\d{2})?))?/);
      if (!m) {
        const d = Date.parse(t);
        return isNaN(d) ? NaN : d;
      }
      const [_, y, mo, da, h, mi, se, compactH, compactMi, compactSe] = m;
      return Date.UTC(
        +y,
        +mo - 1,
        +da,
        +(h || compactH || 0),
        +(mi || compactMi || 0),
        +(se || compactSe || 0)
      );
    }

    // 최신 archive 항목이 위로 오도록 desc 정렬. 날짜 없으면 뒤로, 동률은 id/title/source 안정 fallback.
    function sortDoneByCompletionDesc(items) {
      return items.slice().sort((a, b) => {
        const ta = parseDateMs(pickCompleted(a));
        const tb = parseDateMs(pickCompleted(b));
        const aOk = !isNaN(ta), bOk = !isNaN(tb);
        if (aOk && bOk && ta !== tb) return tb - ta;
        if (aOk && !bOk) return -1;
        if (!aOk && bOk) return 1;
        return (b.id || "").localeCompare(a.id || "")
            || (a.title || "").localeCompare(b.title || "")
            || (a.source || "").localeCompare(b.source || "");
      });
    }

    function buildCard(it, sourceLabel, opts) {
      const compact = !!(opts && opts.compact);
      const card = document.createElement("div");
      const st = it.meta.status || it.meta.decision || "";
      const isDecision = !compact && (String(sourceLabel || "").toLowerCase() === "waiting" || String(st).toLowerCase() === "waiting") && pickDecisionQuestion(it);
      card.className = "card" + (compact ? " compact" : "") + (isDecision ? " decision-card" : "");
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "상세 보기");
      card.addEventListener("click", () => openDetailModal(it, sourceLabel));
      card.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          openDetailModal(it, sourceLabel);
        }
      });
      const titleEl = document.createElement("div");
      titleEl.className = "title";
      titleEl.textContent = it.title || it.id || "(제목 없음)";
      if (isDecision) {
        const kicker = document.createElement("div");
        kicker.className = "decision-kicker";
        kicker.textContent = it.id ? it.id + " · 판단할 것" : "판단할 것";
        card.appendChild(kicker);

        const question = document.createElement("div");
        question.className = "decision-question";
        question.textContent = pickDecisionQuestion(it);
        card.appendChild(question);

        const options = splitDecisionOptions(it.meta.options);
        if (options.length) {
          const optionsEl = document.createElement("div");
          optionsEl.className = "decision-options";
          for (const opt of options) {
            const chip = document.createElement("span");
            chip.className = "decision-option";
            chip.textContent = opt;
            optionsEl.appendChild(chip);
          }
          card.appendChild(optionsEl);
        }

        const notes = [];
        if (it.meta.default) notes.push("기본값: " + it.meta.default);
        if (it.meta.reason) notes.push("이유: " + it.meta.reason);
        if (it.meta.next) notes.push("다음: " + it.meta.next);
        if (notes.length) {
          const note = document.createElement("div");
          note.className = "decision-note";
          note.textContent = notes.join("\n");
          card.appendChild(note);
        }
      } else {
        card.appendChild(titleEl);
      }

      const metaEl = document.createElement("div");
      metaEl.className = "meta";
      // 제목은 내용으로 시작하고, id는 메타 줄의 배지로 내린다 (decision 카드는 kicker에 이미 id가 있음)
      if (it.id && !isDecision) {
        const idb = document.createElement("span");
        idb.className = "badge b-id";
        idb.textContent = it.id;
        metaEl.appendChild(idb);
      }
      if (!compact) {
        const src = document.createElement("span");
        src.className = "badge";
        src.textContent = it.source || sourceLabel;
        metaEl.appendChild(src);
      }
      if (st) {
        const b = document.createElement("span");
        const stKey = String(st).trim().toLowerCase().replace(/[-\s]+/g, "_");
        b.className = "badge b-" + stKey;
        b.textContent = st;
        metaEl.appendChild(b);
      }
      if (it.meta.proposed_by) {
        const b = document.createElement("span");
        b.className = "badge b-pending";
        b.textContent = "제안: " + it.meta.proposed_by;
        metaEl.appendChild(b);
      }
      // 열린 레인의 정체 가시화: 며칠째 머물러 있는지. 7일 이상은 경고색.
      const lane = (opts && opts.lane) || "";
      if (lane === "inbox" || lane === "active" || lane === "waiting") {
        const days = ageDays(it, Date.now());
        if (days !== null && days >= 1) {
          const ab = document.createElement("span");
          ab.className = "badge b-age" + (days >= 7 ? " b-stale" : "");
          ab.textContent = "D+" + days;
          metaEl.appendChild(ab);
        }
      }
      const up = pickUpdated(it);
      if (up) {
        const t = document.createElement("span");
        // 컴팩트(Archive)에서는 날짜만 노출해 가로 폭 절약
        t.textContent = compact ? String(up).slice(0, 10) : up;
        metaEl.appendChild(t);
      }
      card.appendChild(metaEl);

      // 태그 다이어트: 카드에는 project 1개 + type 1개만. topics는 필터/상세용 데이터로만 유지.
      const projects = Array.isArray(it.meta.projects) ? it.meta.projects : splitTagList(it.meta.projects);
      const primaryProject = projects[0];
      if (primaryProject || it.meta.task_type) {
        const tagsEl = document.createElement("div");
        tagsEl.className = "tags";
        if (primaryProject) {
          const chip = document.createElement("span");
          chip.className = "tag project";
          chip.textContent = primaryProject;
          tagsEl.appendChild(chip);
        }
        if (it.meta.task_type) {
          const chip = document.createElement("span");
          chip.className = "tag type";
          chip.textContent = it.meta.task_type;
          tagsEl.appendChild(chip);
        }
        card.appendChild(tagsEl);
      }

      if (isDecision) {
        return card;
      } else if (compact) {
        // Archive: 결과(outcome)가 있으면 그것만 1~2줄로, 없으면 본문에서 추출
        const summary = (it.meta && it.meta.outcome) || snippetFromBody(it.bodyLines);
        const archiveRows = (opts && opts.lane) === "done" ? archiveTemplateFields(it) : [];
        if (archiveRows.length) {
          const tmpl = document.createElement("div");
          tmpl.className = "archive-template";
          for (const [labelText, valueText, className] of archiveRows) {
            const row = document.createElement("div");
            row.className = "archive-template-row" + (className ? " " + className : "");
            const label = document.createElement("div");
            label.className = "archive-template-label";
            label.textContent = labelText;
            const value = document.createElement("div");
            value.className = "archive-template-value";
            value.textContent = valueText;
            row.appendChild(label);
            row.appendChild(value);
            tmpl.appendChild(row);
          }
          card.appendChild(tmpl);
        } else if (summary && summary !== it.title) {
          const s = document.createElement("div");
          s.className = "snippet";
          s.textContent = summary;
          card.appendChild(s);
        }
        if ((opts && opts.lane) === "done") {
          const lesson = document.createElement("div");
          lesson.className = "archive-lesson";
          const label = document.createElement("span");
          label.className = "lesson-label";
          label.textContent = "reuse";
          lesson.appendChild(label);
          lesson.appendChild(document.createTextNode(inferArchiveRule(it)));
          card.appendChild(lesson);
        }
      } else {
        // 핵심 필드가 구조화돼 있으면 "무엇을 하고 뭐가 바뀌는지"를 라벨로 보여준다.
        const fieldsEl = buildKeyFields(it, (opts && opts.lane) === "waiting" ? WAITING_FIELD_ROWS : KEY_FIELD_ROWS);
        if (fieldsEl) {
          card.appendChild(fieldsEl);
        } else {
          const snip = snippetFromBody(it.bodyLines);
          if (snip) {
            const s = document.createElement("div");
            s.className = "snippet";
            s.textContent = snip;
            card.appendChild(s);
          }
        }
      }
      return card;
    }

    // 카드에서 바로 읽혀야 하는 핵심 필드. 앞의 두 개(바뀌는 것/완료 기준)는 강조 표시.
    const KEY_FIELD_ROWS = [
      ["goal", "목표", true],
      ["expected_artifact", "바뀌는 것", true],
      ["expected_impact", "기대 효과", true],
      ["success_criteria", "완료 기준", true],
      ["metric_question", "지표 질문", false],
      ["first_verification_gate", "검증 게이트", false],
      ["rationale", "왜", false],
      ["source_signal", "근거 신호", false],
      ["source_note", "근거 노트", false],
      ["gate", "게이트", false],
    ];
    const WAITING_FIELD_ROWS = [
      ["success_criteria", "기대", true],
      ["pending_threads", "작성 대기", true],
      ["next_action", "다음", true],
      ["blocker", "막힘", false],
      ["next_retry_condition", "조건", false],
    ];
    function buildKeyFields(it, rowDefs) {
      const defs = rowDefs || KEY_FIELD_ROWS;
      const rows = defs.filter(([key]) => it.meta && it.meta[key]);
      if (!rows.length) return null;
      const host = document.createElement("div");
      host.className = "field-rows" + (defs === WAITING_FIELD_ROWS ? " waiting-fields" : "");
      for (const [key, label, emphasized] of rows) {
        const row = document.createElement("div");
        row.className = "field-row" + (emphasized ? " key" : "");
        const l = document.createElement("span");
        l.className = "field-label";
        l.textContent = label;
        const v = document.createElement("span");
        v.className = "field-value";
        v.textContent = it.meta[key];
        row.appendChild(l);
        row.appendChild(v);
        host.appendChild(row);
      }
      return host;
    }

    function appendGroupHeader(parent, label, n) {
      const h = document.createElement("div");
      h.className = "group-head";
      h.textContent = label + " · " + n;
      parent.appendChild(h);
    }

    const RECENT_WINDOW_MS = 14 * 24 * 60 * 60 * 1000;
    function partitionRecent(items, nowMs) {
      const cutoff = nowMs - RECENT_WINDOW_MS;
      const recent = [], older = [];
      for (const it of items) {
        const t = parseDateMs(pickCompleted(it));
        if (!isNaN(t) && t >= cutoff) recent.push(it);
        else older.push(it);
      }
      return { recent, older };
    }

    // "YYYY-MM" 키로 월별 묶음 (입력이 완료일 내림차순이므로 삽입 순서가 곧 월 내림차순).
    // 날짜를 못 읽는 항목은 맨 뒤 "날짜 미상" 그룹으로.
    function groupByMonth(items) {
      const groups = new Map();
      const unknown = [];
      for (const it of items) {
        const raw = String(pickCompleted(it));
        const m = raw.match(/^(\d{4}-\d{2})/);
        if (!m) { unknown.push(it); continue; }
        if (!groups.has(m[1])) groups.set(m[1], []);
        groups.get(m[1]).push(it);
      }
      const out = Array.from(groups.entries());
      if (unknown.length) out.push(["날짜 미상", unknown]);
      return out;
    }

    // 접힌 월 그룹의 한 줄 요약: 개수 + 대표 프로젝트 분포 (펼치지 않고도 그 달의 축이 읽히게)
    function monthSummaryLabel(month, items) {
      const counts = new Map();
      for (const it of items) {
        const projects = Array.isArray(it.meta.projects) ? it.meta.projects : splitTagList(it.meta.projects);
        const p = projects[0]
          || String(it.id || "").split("-").slice(0, -1).join("-")
          || "기타";
        counts.set(p, (counts.get(p) || 0) + 1);
      }
      const top = Array.from(counts.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      const parts = top.slice(0, 2).map(([k, v]) => k + " " + v);
      const rest = top.slice(2).reduce((s, e) => s + e[1], 0);
      if (rest) parts.push("기타 " + rest);
      return month + " · " + items.length + "개" + (parts.length ? " — " + parts.join(" · ") : "");
    }

    function archiveFilterQuery() {
      const el = document.getElementById("archive-filter-input");
      return el ? el.value.trim().toLowerCase() : "";
    }

    function applyArchiveFilter(items) {
      const q = archiveFilterQuery();
      const tag = activeArchiveTag;
      return items.filter(it => {
        const blob = [
          it.id || "",
          it.title || "",
          (it.meta && it.meta.outcome) || "",
          allTags(it).join(" "),
          (it.bodyLines || []).join(" "),
        ].join(" ").toLowerCase();
        const qOk = !q || blob.includes(q);
        const tagOk = !tag || allTags(it).map(x => String(x).toLowerCase()).includes(tag);
        return qOk && tagOk;
      });
    }

    function renderArchiveTagFilter(items) {
      const host = document.getElementById("archive-tag-filter");
      if (!host) return;
      const counts = new Map();
      for (const item of items) {
        for (const tag of allTags(item)) {
          const key = String(tag).toLowerCase();
          counts.set(key, (counts.get(key) || 0) + 1);
        }
      }
      if (activeArchiveTag && !counts.has(activeArchiveTag)) activeArchiveTag = "";
      host.replaceChildren();
      const tags = Array.from(counts.entries())
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .slice(0, 18);
      if (!tags.length) return;
      const allBtn = document.createElement("button");
      allBtn.className = "tag-filter-button" + (!activeArchiveTag ? " active" : "");
      allBtn.type = "button";
      allBtn.textContent = "all";
      allBtn.addEventListener("click", () => {
        activeArchiveTag = "";
        renderColumn("done", lastDoneItems, lastDoneSource);
      });
      host.appendChild(allBtn);
      for (const [tag, count] of tags) {
        const btn = document.createElement("button");
        btn.className = "tag-filter-button" + (activeArchiveTag === tag ? " active" : "");
        btn.type = "button";
        btn.textContent = tag + " " + count;
        btn.addEventListener("click", () => {
          activeArchiveTag = activeArchiveTag === tag ? "" : tag;
          renderColumn("done", lastDoneItems, lastDoneSource);
        });
        host.appendChild(btn);
      }
    }

    function renderColumn(key, items, sourceLabel) {
      const col = document.querySelector('.column[data-key="' + key + '"]');
      const cards = col.querySelector("[data-cards]");
      const count = col.querySelector("[data-count]");
      cards.innerHTML = "";

      if (key === "done") {
        const sortedItems = sortDoneByCompletionDesc(items);
        renderArchiveMemory(sortedItems);
        renderArchiveTagFilter(sortedItems);
        const filtered = sortDoneByCompletionDesc(applyArchiveFilter(sortedItems));
        count.textContent = filtered.length === items.length
          ? items.length + "개"
          : filtered.length + " / " + items.length + "개";
        if (filtered.length === 0) {
          const e = document.createElement("div");
          e.className = "empty";
          e.textContent = items.length === 0 ? "비어 있음" : "일치 없음";
          cards.appendChild(e);
          return;
        }
        const { recent, older } = partitionRecent(filtered, Date.now());
        if (recent.length) {
          appendGroupHeader(cards, "지난 14일", recent.length);
          for (const it of recent) cards.appendChild(buildCard(it, sourceLabel, { compact: true, lane: "done" }));
        }
        if (older.length) {
          appendGroupHeader(cards, "이전", older.length);
          // 월 단위 접힌 그룹. 필터/태그 검색 중에는 매치가 숨지 않게 자동으로 펼친다.
          const filterActive = !!(archiveFilterQuery() || activeArchiveTag);
          for (const [month, items] of groupByMonth(older)) {
            const det = document.createElement("details");
            det.className = "month-group";
            if (filterActive) det.open = true;
            const sum = document.createElement("summary");
            sum.textContent = monthSummaryLabel(month, items);
            det.appendChild(sum);
            const box = document.createElement("div");
            box.className = "month-cards";
            for (const it of items) box.appendChild(buildCard(it, sourceLabel, { compact: true, lane: "done" }));
            det.appendChild(box);
            cards.appendChild(det);
          }
        }
        return;
      }

      count.textContent = items.length + "개";
      if (items.length === 0) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "비어 있음";
        cards.appendChild(e);
        return;
      }
      for (const it of items) {
        cards.appendChild(buildCard(it, sourceLabel, { compact: false, lane: key }));
      }
    }

    // 레인별 개수는 컬럼 헤더가 이미 보여주므로, 요약 밴드는 흐름(이번 주 완료·최장 체류)만 담는다.
    function renderSummary(counts, flow) {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = String(v); };
      set("sum-open", counts.inbox + counts.active + counts.waiting);
      set("sum-week-done", flow.weekDone);
      const staleWrap = document.getElementById("sum-stale-wrap");
      if (staleWrap) {
        if (flow.stale) {
          staleWrap.hidden = false;
          set("sum-stale", flow.stale.id + " D+" + flow.stale.days);
        } else {
          staleWrap.hidden = true;
        }
      }
    }

    /* Legacy parser retained only for old cached deployments. The live read model is
       generated from explicit knowledge-loop markers, never inferred from prose. */
    function parseWikiLogEntries(text, source) {
      const chunks = String(text || "").split(/(?=^##\s+\d{4}-\d{2}-\d{2})/m);
      return chunks.map(chunk => {
        const lines = chunk.trim().split("\n");
        const head = lines.shift() || "";
        const match = head.match(/^##\s+(\d{4}-\d{2}-\d{2}[^|]*)\|\s*(.+)$/);
        if (!match) return null;
        const detail = lines.filter(line => /^-\s+/.test(line)).map(line => line.replace(/^-\s+/, "").trim());
        const blob = detail.join(" ");
        const typeMatch = blob.match(/(?:^|\s)(ingest|query|lint)\s*:/i);
        const type = typeMatch ? typeMatch[1].toLowerCase() : "ingest";
        return { date: match[1].trim(), title: match[2].trim(), detail, blob, type, source };
      }).filter(Boolean);
    }

    function knowledgeAction(entry) {
      if (entry.type === "lint") return "lint 근거 재확인";
      if (entry.type === "query") return "재검색 intent 요청";
      return "승격 근거 열기";
    }

    function knowledgeBucket(entry) {
      const text = ((entry.summary || entry.title || "") + " " + (entry.next_action || entry.blob || "")).toLowerCase();
      if (entry.loop_state === "resolved" || entry.loop_state === "dismissed") return "promoted";
      if (entry.loop_state === "open" && entry.recheck !== "none") return "research";
      if (["queued", "active"].includes(entry.loop_state)) return "open";
      if (entry.type === "ingest" || /승격|컴파일|갱신/.test(text)) return "promoted";
      return "recent";
    }

    function submitKnowledgeAction(button, status, entry) {
      const item = { id: entry.id, title: entry.summary || entry.title };
      const source = "agent-wiki-log";
      const payload = actionSummary(item, source, "knowledge_research");
      payload.note = [entry.at || entry.date, entry.type, entry.summary || entry.title, entry.next_action].filter(Boolean).join(" | ").slice(0, 1000);
      const actionKey = getActionKey();
      if (!actionKey) { status.classList.add("error"); status.textContent = "액션 키 필요"; return; }
      button.disabled = true; status.classList.remove("error"); status.textContent = "요청 접수 중...";
      fetch(SOURCES.actionEndpoint, { method: "POST", headers: { "Content-Type": "application/json", "X-Infinity-Action-Key": actionKey }, body: JSON.stringify(payload) })
        .then(r => r.json().then(data => ({ r, data })))
        .then(({ r, data }) => { if (!r.ok || !data.ok) throw new Error(data.error || ("HTTP " + r.status)); status.textContent = data.status === "already_queued" ? "이미 접수됨" : "재검색 요청 접수됨"; })
        .catch(error => { button.disabled = false; status.classList.add("error"); status.textContent = "접수 실패 · " + (error.message || "다시 시도 필요"); });
    }

    function renderKnowledgeLoop(entries) {
      const host = document.getElementById("knowledge-loop-grid");
      const note = document.getElementById("knowledge-loop-note");
      const updated = document.getElementById("knowledge-loop-updated");
      const lanes = [{ key: "research", label: "다시 확인할 질문" }, { key: "open", label: "아직 결론이 없는 질문" }, { key: "promoted", label: "위키에 반영됨" }, { key: "recent", label: "최근 루프" }];
      const buckets = Object.fromEntries(lanes.map(lane => [lane.key, []]));
      entries.sort((a, b) => String(b.date).localeCompare(String(a.date))).forEach(entry => buckets[knowledgeBucket(entry)].push(entry));
      host.replaceChildren();
      lanes.forEach(lane => {
        const column = document.createElement("section"); column.className = "knowledge-lane";
        const heading = document.createElement("h3"); heading.textContent = lane.label + " · " + buckets[lane.key].length; column.appendChild(heading);
        const shown = buckets[lane.key].slice(0, 3);
        if (!shown.length) { const empty = document.createElement("div"); empty.className = "knowledge-empty"; empty.textContent = "현재 항목 없음"; column.appendChild(empty); }
        shown.forEach(entry => {
          const card = document.createElement("article"); card.className = "knowledge-card";
          const title = document.createElement("div"); title.className = "knowledge-card-title"; title.textContent = entry.summary || entry.title;
          const meta = document.createElement("div"); meta.className = "knowledge-card-meta"; meta.textContent = (entry.at || entry.date) + " · " + entry.type + " · " + (entry.loop_state || entry.source);
          const next = document.createElement("div"); next.className = "knowledge-card-next"; next.textContent = entry.next_action || (entry.detail && entry.detail[entry.detail.length - 1]) || "다음 판단 근거를 확인합니다.";
          card.append(title, meta, next);
          if (lane.key === "research" || lane.key === "open") { const button = document.createElement("button"); button.type = "button"; button.className = "knowledge-action"; button.textContent = knowledgeAction(entry); const status = document.createElement("span"); status.className = "action-status"; button.addEventListener("click", () => submitKnowledgeAction(button, status, entry)); card.append(button, status); }
          column.appendChild(card);
        });
        host.appendChild(column);
      });
      note.textContent = entries.length ? "구조화된 로그 " + entries.length + "건을 집계했습니다. 상태 없는 과거 로그는 이 보드에서 판단하지 않습니다." : "구조화된 루프 이벤트가 아직 없습니다.";
      updated.textContent = entries.length ? "최신 " + entries.map(x => x.at || x.date).sort().pop() : "";
    }

    async function loadKnowledgeLoop() {
      const model = await fetch(SOURCES.knowledgeLoop, { cache: "no-cache" }).then(response => {
        if (!response.ok) throw new Error("loop model HTTP " + response.status);
        return response.json();
      });
      const entries = Array.isArray(model.events) ? model.events : [];
      renderKnowledgeLoop(entries);
    }

    async function fetchMaybeWikiText(path) { try { return await fetchText(SOURCES.wikiRawBase + path); } catch (_) { return ""; } }

    async function loadAndRender() {
      archiveHydrationRun += 1;
      archiveTemplateCache.clear();
      detailCache.clear();
      clearErrors();
      statusEl.textContent = "로딩 중...";
      let intentsText = "", gatesText = "";
      // 공개 raw 파일을 우선 사용해 GitHub API 지연·rate limit 때문에
      // 정본 대시보드 전체가 "로딩 중"에 멈추지 않도록 한다.
      try { intentsText = await fetchTextWithFallback(SOURCES.rawIntents, SOURCES.intents); }
      catch (e) { showError("INTENTS.md 로드 실패: " + e.message); }
      try { gatesText = await fetchTextWithFallback(SOURCES.rawGates, SOURCES.gates); }
      catch (e) { showError("GATES.md 로드 실패: " + e.message); }

      const intentSections = splitSections(intentsText);
      const gateSections = splitSections(gatesText);

      const inboxItems = mergeById(
        parseItems(intentSections["Inbox"] || ""),
        parseIntentComments(intentSections["Inbox"] || "", "Inbox")
      );
      const activeItems = mergeById(
        parseItems(intentSections["Active"] || ""),
        parseIntentComments(intentSections["Active"] || "", "Active")
      );
      // 같은 intent가 INTENTS Waiting과 GATES 대기 중에 함께 있으면 INTENTS 항목(필드가 더 풍부)만 남긴다.
      const waitingItems = mergeById(
        mergeById(
          parseItems(intentSections["Waiting"] || ""),
          parseIntentComments(intentSections["Waiting"] || "", "Waiting")
        ).map(x => ({ ...x, source: x.source || "INTENTS.md" })),
        parseItems(gateSections["대기 중"] || gateSections["Waiting"] || "").map(x => ({ ...x, source: "GATES.md" }))
      );
      const archiveCommentItems = mergeById(
        parseArchiveComments(intentSections["Archive"] || ""),
        [
          ...parseArchiveComments(intentSections["Inbox"] || ""),
          ...parseArchiveComments(intentSections["Active"] || ""),
          ...parseArchiveComments(intentSections["Waiting"] || ""),
        ]
      );
      const doneItems = sortDoneByCompletionDesc([
        // Archive는 완료 코멘트뿐 아니라 전체 Intent 블록으로도 저장된다.
        // 전체 블록을 읽지 않으면 research/product 등 정식 Archive 카드가 대시보드에서 사라진다.
        ...parseItems(intentSections["Archive"] || "").map(x => ({ ...x, source: "INTENTS.md Archive" })),
        ...parseItems(gateSections["처리 완료"] || gateSections["Resolved"] || "")
          .map(x => ({ ...x, source: "GATES.md" })),
        ...archiveCommentItems,
      ]);

      renderColumn("inbox",   inboxItems,   "INTENTS.md");
      renderColumn("active",  activeItems,  "INTENTS.md");
      renderColumn("waiting", waitingItems, "Waiting");
      renderColumn("done",    doneItems,    "GATES.md");

      const nowMs = Date.now();
      const weekDone = doneItems.filter(it => {
        const t = parseDateMs(pickCompleted(it));
        return !isNaN(t) && t <= nowMs && t >= nowMs - 7 * 86400000;
      }).length;
      let stale = null;
      for (const it of [...inboxItems, ...activeItems, ...waitingItems]) {
        const days = ageDays(it, nowMs);
        if (days === null) continue;
        if (!stale || days > stale.days) stale = { id: it.id || "?", days };
      }
      renderSummary({
        inbox: inboxItems.length,
        active: activeItems.length,
        waiting: waitingItems.length,
        done: doneItems.length,
      }, { weekDone, stale: stale && stale.days >= 1 ? stale : null });

      // Archive 필터 재적용을 위해 최신 doneItems 보관
      lastDoneItems = doneItems;
      lastDoneSource = "GATES.md";
      scheduleArchiveHydration(doneItems);
      loadKnowledgeLoop().catch(error => showError("Agent Wiki 로그 로드 실패: " + error.message));

      statusEl.textContent = "업데이트: " + new Date().toLocaleString("ko-KR");
    }

    let lastDoneItems = [];
    let lastDoneSource = "GATES.md";
    let activeArchiveTag = "";
    const archiveTemplateCache = new Map();
    let archiveHydrationRun = 0;
    let archiveRerenderTimer = null;

    function rerenderArchiveLane() {
      renderColumn("done", lastDoneItems, lastDoneSource);
    }

    function scheduleArchiveRerender() {
      if (archiveRerenderTimer) return;
      archiveRerenderTimer = setTimeout(() => {
        archiveRerenderTimer = null;
        rerenderArchiveLane();
      }, 120);
    }

    function scheduleArchiveHydration(items) {
      const run = ++archiveHydrationRun;
      const start = () => {
        if (run !== archiveHydrationRun) return;
        const latestFirst = items.slice(0, 24);
        setTimeout(async () => {
          const changed = await hydrateArchiveTemplates(latestFirst, run, scheduleArchiveRerender);
          if (changed && run === archiveHydrationRun) scheduleArchiveRerender();
        }, 350);
        if (items.length > latestFirst.length) {
          setTimeout(async () => {
            const changed = await hydrateArchiveTemplates(items.slice(24), run, null);
            if (changed && run === archiveHydrationRun) scheduleArchiveRerender();
          }, 2500);
        }
      };
      if (document.readyState === "complete") {
        start();
      } else {
        window.addEventListener("load", start, { once: true });
      }
    }

    async function hydrateArchiveTemplates(items, run, onProgress) {
      const targets = items
        .filter(it => it && it.meta && (it.meta.detail || it.id) && !hasArchiveTemplate(it.meta));
      let changed = false;
      for (const item of targets) {
        if (run !== archiveHydrationRun) return changed;
        const path = normalizePath(item.meta.detail || ("intents/archive/" + item.id + ".md"));
        if (!path || !path.startsWith("intents/archive/")) continue;
        if (archiveTemplateCache.has(path)) {
          const cached = archiveTemplateCache.get(path);
          if (hasArchiveTemplate(cached)) {
            Object.assign(item.meta, cached);
            changed = true;
            if (onProgress) onProgress();
          }
          continue;
        }
        try {
          const text = await fetchText(SOURCES.rawBase + path);
          if (run !== archiveHydrationRun) return changed;
          const template = extractArchiveTemplate(text);
          archiveTemplateCache.set(path, template);
          if (hasArchiveTemplate(template)) {
            Object.assign(item.meta, template);
            changed = true;
            if (onProgress) onProgress();
          }
        } catch (e) {
          archiveTemplateCache.set(path, {});
        }
      }
      return changed;
    }

    function rescheduleAuto() {
      if (timer) { clearInterval(timer); timer = null; }
      const sec = parseInt(intervalSel.value, 10);
      if (sec > 0) timer = setInterval(loadAndRender, sec * 1000);
    }

    refreshBtn.addEventListener("click", loadAndRender);
    intervalSel.addEventListener("change", rescheduleAuto);
    const archiveFilterInput = document.getElementById("archive-filter-input");
    if (archiveFilterInput) {
      archiveFilterInput.addEventListener("input", () => {
        renderColumn("done", lastDoneItems, lastDoneSource);
      });
    }
    detailClose.addEventListener("click", closeDetailModal);
    detailModal.addEventListener("click", (ev) => {
      if (ev.target === detailModal) closeDetailModal();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") closeDetailModal();
    });

    loadAndRender();
    rescheduleAuto();
  </script>
</body>
</html>
