  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --inbox: #f59e0b;
      --active: #22c55e;
      --waiting: #a855f7;
      --done: #64748b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      padding: 14px 18px;
      background: rgba(15,23,42,.92);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 18px; margin: 0; }
    header .spacer { flex: 1; }
    header .meta { color: var(--muted); font-size: 12px; }
    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #334155; }
    main {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
      padding: 14px;
    }
    @media (max-width: 1100px) {
      main { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; }
    }
    .column {
      background: var(--panel);
      border-radius: 10px;
      padding: 10px 10px 14px;
      min-height: 200px;
      display: flex; flex-direction: column;
    }
    .column-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 6px 10px;
      border-bottom: 1px solid #334155;
      margin-bottom: 10px;
    }
    .column-title { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.inbox { background: var(--inbox); }
    .dot.active { background: var(--active); }
    .dot.waiting { background: var(--waiting); }
    .dot.done { background: var(--done); }
    .count { color: var(--muted); font-size: 12px; }
    .cards { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    .card {
      background: var(--panel-2);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
    }
    .card .title { font-weight: 600; margin-bottom: 4px; word-break: break-word; }
    .badge.b-approved, .badge.b-completed, .badge.b-done, .badge.b-archived, .badge.b-resolved, .badge.b-closed {
      background: #14532d; color: #bbf7d0; border-color: #166534;
    }
    .badge.b-rejected, .badge.b-canceled, .badge.b-cancelled, .badge.b-blocked, .badge.b-failed {
      background: #7f1d1d; color: #fecaca; border-color: #991b1b;
    }
    .badge.b-pending, .badge.b-waiting, .badge.b-paused {
      background: #78350f; color: #fde68a; border-color: #92400e;

      background: #1e3a8a; color: #bfdbfe; border-color: #1d4ed8;
    }
    .card .meta {
      color: var(--muted); font-size: 11px;
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px;
    }
    .tags {
      display: flex; gap: 4px; flex-wrap: wrap;
      margin: 4px 0 2px;
    }
    .tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid #475569;
      background: #172033;
      color: #cbd5e1;
      font-size: 10px;
      line-height: 1.6;
    }
    .tag.project { border-color: #0e7490; color: #a5f3fc; background: #083344; }
    .tag.type { border-color: #92400e; color: #fde68a; background: #3b2507; }
    .tag.topic { border-color: #475569; color: #cbd5e1; background: #172033; }
    .card .snippet {
      color: #cbd5e1; font-size: 12px;
      white-space: pre-wrap; word-break: break-word;
      max-height: 6.5em; overflow: hidden;
      position: relative;
    }
    .field-rows { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .field-row { display: flex; gap: 6px; font-size: 12px; align-items: baseline; }
    .field-label {
      flex: none; color: var(--muted); font-size: 10px;
      border: 1px solid #334155; border-radius: 4px;
      padding: 0 5px; line-height: 1.7; white-space: nowrap;
    }
    .field-row.key .field-label { border-color: #0e7490; color: #a5f3fc; }
    .field-value {
      color: #cbd5e1; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .field-rows.waiting-fields {
      padding-top: 6px;
      border-top: 1px solid rgba(245, 158, 11, .18);
    }
    .field-rows.waiting-fields .field-row.key .field-label {
      border-color: #92400e;
      color: #fde68a;
      background: #3b2507;
    }
    details.month-group { margin: 6px 0 0; }
    details.month-group > summary {
      cursor: pointer; list-style: none;
      font-size: 11px; color: var(--muted);
      padding: 6px 8px; border-radius: 6px;
      background: var(--panel-2); border: 1px solid #334155;
      user-select: none;
    }
    details.month-group > summary::-webkit-details-marker { display: none; }
    details.month-group > summary::before { content: "▸ "; }
    details.month-group[open] > summary::before { content: "▾ "; }
    details.month-group > summary:hover { background: #334155; }
    details.month-group .month-cards { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
    .badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 11px; background: #334155; color: var(--text);
    }
    .badge.b-id {
      background: #0b1220; color: #7dd3fc; border: 1px solid #155e75;
      font-variant-numeric: tabular-nums;
    }
    .badge.b-age { background: #1f2937; color: #cbd5e1; }
    .badge.b-stale { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }
    .empty {
      color: var(--muted); font-size: 12px; padding: 12px 6px;
    }
    .error {
      background: #7f1d1d; color: #fee2e2; padding: 8px 12px;
      border-radius: 6px; font-size: 12px; margin: 10px 14px;
    }
    .summary-band {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 12px 14px 0;
    }
    .summary-item {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 5px 12px;
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted);
    }
    .summary-item .summary-label { display: inline-flex; align-items: center; gap: 6px; }
    .summary-item .summary-value { font-weight: 700; font-size: 14px; color: var(--text); }
    .summary-item.open { background: #1e3a8a; border-color: #1d4ed8; color: #dbeafe; }
    .summary-item.open .summary-value { color: #ffffff; }
    .summary-item.lane-inbox { border-color: #b45309; }
    .summary-item.lane-active { border-color: #15803d; }
    .summary-item.lane-waiting { border-color: #7c3aed; }
    .summary-item.lane-done { border-color: #475569; }
    .knowledge-loop { margin: 18px 14px 4px; padding: 16px; border: 1px solid #334155; border-radius: 14px; background: radial-gradient(circle at 90% 0, rgba(56,189,248,.15), transparent 36%), #111c30; }
    .knowledge-loop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .knowledge-loop-title { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .knowledge-loop-note { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .knowledge-loop-grid { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
    .knowledge-lane { min-width: 0; padding: 10px; border: 1px solid #334155; border-radius: 10px; background: rgba(15,23,42,.65); }
    .knowledge-lane h3 { margin: 0 0 8px; color: #cbd5e1; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
    .knowledge-card { padding: 9px 0; border-top: 1px solid rgba(148,163,184,.17); }
    .knowledge-card:first-of-type { border-top: 0; padding-top: 0; }
    .knowledge-card-title { color: #e2e8f0; font-size: 12px; font-weight: 650; line-height: 1.45; }
    .knowledge-card-meta { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .knowledge-card-next { margin-top: 5px; color: #bae6fd; font-size: 11px; line-height: 1.45; }
    .knowledge-action { margin-top: 8px; padding: 4px 8px; border-color: #0e7490; background: #083344; color: #cffafe; font-size: 11px; }
    .knowledge-action:hover { background: #0c4a6e; }
    .knowledge-empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
    @media (max-width: 1100px) { .knowledge-loop-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 640px) { .knowledge-loop { margin: 14px 10px 2px; } .knowledge-loop-grid { grid-template-columns: 1fr; } }
    .archive-filter {
      padding: 0 6px 8px;
    }
    .archive-memory {
      margin: 0 6px 10px;
      padding: 11px 12px 12px;
      border: 1px solid #475569;

    .archive-lesson {

    }

      color: #93c5fd;

    }

      color: #e2e8f0;

      line-height: 1.42;
      overflow-wrap: anywhere;

    }
    .archive-template-row.next .archive-template-value {
      color: #fef3c7;
    }
    .archive-filter-input {
      background: #0f1a2e;

      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      width: 100%;
    }
    .archive-filter-input::placeholder { color: var(--muted); }
    .archive-filter-input:focus { outline: none; border-color: var(--accent); }
    .tag-filter-row {
      display: flex;
      flex-wrap: wrap;

    .tag-filter-button {
      border-radius: 999px;

    }

      background: #083344;

    }

      font-size: 10px;

    .card.compact .title { font-weight: 500; font-size: 12px; margin-bottom: 2px; line-height: 1.35; }

    source:

    <a href="https://github.com/shdkej/infinity/blob/main/GATES.md" target="_blank" rel="noopener">GATES.md</a>
    — 클라이언트에서 GitHub raw URL을 직접 호출합니다 (수 분 캐시 지연 가능)
  </footer>
  <script>
    const SOURCES = {
      intents: "https://api.github.com/repos/shdkej/infinity/contents/INTENTS.md?ref=main",
      gates:   "https://api.github.com/repos/shdkej/infinity/contents/GATES.md?ref=main",
      rawIntents: "https://raw.githubusercontent.com/shdkej/infinity/main/INTENTS.md",
      rawGates: "https://raw.githubusercontent.com/shdkej/infinity/main/GATES.md",
      knowledgeLoop: "https://raw.githubusercontent.com/shdkej/agent-wiki/main/content/docs/data/knowledge-loop.json",
      rawBase: "https://raw.githubusercontent.com/shdkej/infinity/main/",
      apiBase: "https://api.github.com/repos/shdkej/infinity/contents/",
      actionEndpoint: "https://k23v4cvkqtxkuj5ceech43m5mq0aedhq.lambda-url.ap-northeast-2.on.aws/",
    };

    const statusEl = document.getElementById("status");
    const errorHost = document.getElementById("error-host");
    const refreshBtn = document.getElementById("refresh");
    const intervalSel = document.getElementById("interval");
    const detailModal = document.getElementById("detail-modal");
    const detailTitle = document.getElementById("detail-title");
    const detailBody = document.getElementById("detail-body");
    const detailClose = document.getElementById("detail-close");

    let timer = null;

    function showError(msg) {
      const div = document.createElement("div");
      div.className = "error";
      div.textContent = msg;
      errorHost.appendChild(div);
    }
    function clearErrors() { errorHost.innerHTML = ""; }

    async function fetchText(url) {
      const headers = url.includes("api.github.com/repos/shdkej/infinity/contents/")
        ? { "Accept": "application/vnd.github.raw" }
        : {};
      const r = await fetch(url, { cache: "no-cache", headers });
      if (!r.ok) throw new Error(url + " → HTTP " + r.status);
      return await r.text();
    }

    async function fetchMaybeText(path) {
      if (!path) return null;
      try { return await fetchText(SOURCES.rawBase + path.replace(/^\/+/, "")); }
      catch (e) { return null; }
    }

    async function fetchTextWithFallback(primaryUrl, fallbackUrl) {
      try {
        return await fetchText(primaryUrl);
      } catch (primaryError) {
        if (!fallbackUrl) throw primaryError;
        try {
          return await fetchText(fallbackUrl);
        } catch (fallbackError) {
          throw new Error(primaryError.message + "; raw fallback failed: " + fallbackError.message);
        }
      }
    }

    function normalizePath(path) {
      if (!path) return "";
      return path.replace(/^`|`$/g, "").replace(/^\/+/, "");
    }

    async function fetchArchiveIntent(id) {
      if (!id) return null;
      const path = "intents/archive/" + id + ".md";
      const text = await fetchMaybeText(path);
      return text ? { path, text } : null;
    }

    function detectKind(name) {
      if (/\.(png|jpe?g|gif|svg|webp|avif)$/i.test(name)) return "image";
      if (/\.(html?|xhtml)$/i.test(name)) return "html";
      if (/\.(md|txt|json|ya?ml|csv|log)$/i.test(name)) return "text";
      return null;
    }

    let rateLimited = false;
    async function ghDir(path) {
      const dirUrl = SOURCES.apiBase + path;
      const r = await fetch(dirUrl, { cache: "no-cache" });
      if (r.status === 403 || r.status === 429) { rateLimited = true; return null; }
      if (!r.ok) return null;
      return await r.json();
    }

    async function fetchArtifactsList(id) {
      if (!id) return [];
      const listing = await ghDir("artifacts/" + encodeURIComponent(id));
      if (!listing) return [];
      const items = listing
        .filter(x => x.type === "file" && detectKind(x.name))
        .sort((a, b) => a.name.localeCompare(b.name));
      const tasks = items.map(async (it) => {
        if (!it.download_url) return null;
        const kind = detectKind(it.name);
        try {
          if (kind === "image") return { name: it.name, kind, url: it.download_url };
          const text = await fetchText(it.download_url);
          return { name: it.name, kind, text, url: it.download_url };
        } catch (e) { return null; }
      });
      return (await Promise.all(tasks)).filter(Boolean);
    }

    async function fetchLatestReport(id) {
      if (!id) return null;
      const listing = await ghDir("reports/" + encodeURIComponent(id));
      if (!listing) return null;
      const files = listing
        .filter(x => x.type === "file" && detectKind(x.name) && !/^_/.test(x.name))
        .sort((a, b) => a.name.localeCompare(b.name));
      // 같은 시점 보고서가 .md / .html 로 함께 있으면 HTML 최종본을 우선 노출한다.
      const htmlFiles = files.filter(x => detectKind(x.name) === "html");
      const pool = htmlFiles.length ? htmlFiles : files;
      const latest = pool[pool.length - 1];
      if (!latest || !latest.download_url) return null;
      const kind = detectKind(latest.name);
      const entry = { name: latest.name, kind, url: latest.download_url };
      if (kind !== "image") {
        try { entry.text = await fetchText(latest.download_url); }
        catch (e) { return null; }
      }
      return entry;
    }

    const KIND_LABELS = {
      "kind-summary": "Summary",
      "kind-archive": "Intent",
      "kind-action": "Action",
      "kind-detail": "Detail",
      "kind-threads": "Threads",
      "kind-artifact": "Artifact",
      "kind-report": "Report",
      "kind-empty": "Empty",
    };

    function makeBlock(title, kindClass, opts) {
      opts = opts || {};
      const block = document.createElement("section");
      block.className = "detail-block" + (kindClass ? " " + kindClass : "");
      const collapsible = kindClass !== "kind-summary";
      const startCollapsed = collapsible && !opts.expanded;
      if (startCollapsed) block.classList.add("collapsed");
      const h = document.createElement("h3");
      if (collapsible) {
        h.setAttribute("role", "button");
        h.tabIndex = 0;
        h.setAttribute("aria-expanded", String(!!opts.expanded));
      }
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = KIND_LABELS[kindClass] || "Info";
      const titleEl = document.createElement("span");
      titleEl.className = "title-text";
      titleEl.textContent = title;
      const icon = document.createElement("span");
      icon.className = "collapse-icon";
      icon.textContent = collapsible ? (startCollapsed ? "펼치기" : "접기") : "";
      h.appendChild(label);
      h.appendChild(titleEl);
      h.appendChild(icon);
      if (collapsible) {
        const toggle = () => {
          const nextCollapsed = !block.classList.contains("collapsed");
          block.classList.toggle("collapsed", nextCollapsed);
          h.setAttribute("aria-expanded", String(!nextCollapsed));
          icon.textContent = nextCollapsed ? "펼치기" : "접기";
        };
        h.addEventListener("click", toggle);
        h.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            toggle();
          }
        });
      }
      block.appendChild(h);
      detailBody.appendChild(block);
      return block;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function safeMarkdownUrl(value) {
      const url = String(value || "").trim().replace(/&amp;/g, "&");
      if (/^(https?:|mailto:|#)/i.test(url)) return escapeHtml(url);
      return "#";
    }

    function inlineMarkdown(value) {
      let html = escapeHtml(value);
      const codeTokens = [];
      const elementTokens = [];
      html = html.replace(/`([^`]+)`/g, (_, code) => {
        // Keep placeholders free of Markdown punctuation so emphasis parsing
        // cannot mutate them before the protected HTML is restored.
        const token = "@@INLINECODE" + codeTokens.length + "@@";
        codeTokens.push("<code>" + code + "</code>");
        return token;
      });
      html = html.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+[\"']([^\"']*)[\"'])?\)/g, (_, alt, url, caption) => {
        const safeUrl = safeMarkdownUrl(url);
        const token = "@@INLINEELEMENT" + elementTokens.length + "@@";
        elementTokens.push("<img src=\"" + safeUrl + "\" alt=\"" + escapeHtml(alt) + "\"" + (caption ? " title=\"" + escapeHtml(caption) + "\"" : "") + " loading=\"lazy\">");
        return token;
      });
      html = html.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+[\"']([^\"']*)[\"'])?\)/g, (_, label, url, title) => {
        const extra = title ? " title=\"" + escapeHtml(title) + "\"" : "";
        const token = "@@INLINEELEMENT" + elementTokens.length + "@@";
        elementTokens.push("<a href=\"" + safeMarkdownUrl(url) + "\" target=\"_blank\" rel=\"noopener noreferrer\"" + extra + ">" + escapeHtml(label) + "</a>");
        return token;
      });
      html = html.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, (_, prefix, url) => prefix + "<a href=\"" + safeMarkdownUrl(url) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + url + "</a>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      html = html.replace(/~~([^~]+)~~/g, "<del>$1</del>");
      html = html.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>");
      html = html.replace(/(^|[^_])_([^_]+)_(?!_)/g, "$1<em>$2</em>");
      codeTokens.forEach((token, index) => {
        html = html.replace("@@INLINECODE" + index + "@@", token);
      });
      elementTokens.forEach((token, index) => {
        html = html.replace("@@INLINEELEMENT" + index + "@@", token);
      });
      return html;
    }

    function renderMarkdownHtml(markdown) {
      const lines = String(markdown || "").replace(/\r/g, "").split("\n");
      const out = [];
      let paragraph = [];
      let list = null;
      let quote = [];
      let code = null;

      const flushParagraph = () => {
        if (!paragraph.length) return;
        out.push("<p>" + paragraph.map(inlineMarkdown).join("<br>") + "</p>");
        paragraph = [];
      };
      const flushList = () => {
        if (!list) return;
        out.push("<" + list.type + ">" + list.items.map(item => "<li>" + inlineMarkdown(item) + "</li>").join("") + "</" + list.type + ">");
        list = null;
      };
      const flushQuote = () => {
        if (!quote.length) return;
        out.push("<blockquote>" + quote.map(inlineMarkdown).join("<br>") + "</blockquote>");
        quote = [];
      };

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];
        if (code) {
          if (/^\s*```/.test(line)) {
            out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
            code = null;
          } else {
            code.push(line);
          }
          continue;
        }
        const fence = line.match(/^\s*```(?:[\w-]+)?\s*$/);
        if (fence) {
          flushParagraph(); flushList(); flushQuote(); code = [];
          continue;
        }
        if (!line.trim()) {
          flushParagraph(); flushList(); flushQuote();
          continue;
        }
        const heading = line.match(/^(#{1,4})\s+(.+?)\s*#*$/);
        if (heading) {
          flushParagraph(); flushList(); flushQuote();
          const level = heading[1].length;
          out.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
          continue;
        }
        if (/^\s*(?:---+|\*\s*\*\s*\*|___+)\s*$/.test(line)) {
          flushParagraph(); flushList(); flushQuote(); out.push("<hr>");
          continue;
        }
        const quoteLine = line.match(/^\s*>\s?(.*)$/);
        if (quoteLine) {
          flushParagraph(); flushList(); quote.push(quoteLine[1]);
          continue;
        }
        const listLine = line.match(/^\s*(?:[-*+]\s+|\d+[.)]\s+)(.+)$/);
        if (listLine) {
          flushParagraph(); flushQuote();
          const type = /^\s*\d/.test(line) ? "ol" : "ul";
          if (!list || list.type !== type) { flushList(); list = { type, items: [] }; }
          list.items.push(listLine[1]);
          continue;
        }
        if (line.includes("|") && /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i + 1] || "")) {
          flushParagraph(); flushList(); flushQuote();
          const cells = line.trim().replace(/^\||\|$/g, "").split("|").map(cell => cell.trim());
          i += 1;
          const rows = [];
          while (i + 1 < lines.length && lines[i + 1].includes("|") && lines[i + 1].trim()) {
            i += 1;
            rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map(cell => cell.trim()));
          }
          out.push("<table><thead><tr>" + cells.map(cell => "<th>" + inlineMarkdown(cell) + "</th>").join("") + "</tr></thead><tbody>" + rows.map(row => "<tr>" + cells.map((_, index) => "<td>" + inlineMarkdown(row[index] || "") + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
          continue;
        }
        paragraph.push(line);
      }
      if (code) out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
      flushParagraph(); flushList(); flushQuote();
      return out.join("\n") || "<p>내용 없음</p>";
    }

    function addDetailBlock(title, text, kindClass) {
      const block = makeBlock(title, kindClass);
      const source = String(text || "").trim();
      const isCodeLike = /\.(json|ya?ml|csv|log|txt)(?:$|\s)/i.test(title);
      if (!isCodeLike && /\.md(?:$|\s)/i.test(title)) {

    let actionKeyCache = "";

    function getActionKey() {
      if (actionKeyCache) return actionKeyCache;
      const entered = window.prompt("Infinity action key");
      const key = entered ? entered.trim() : "";
      if (key) actionKeyCache = key;
      return key;
    }

    async function submitDashboardAction(button, statusEl, item, sourceLabel, action) {
      const payload = actionSummary(item, sourceLabel, action);
      const actionKey = getActionKey();
      if (!actionKey) {
        statusEl.classList.add("error");
        statusEl.textContent = "액션 키 필요";
        return;
      }
      button.disabled = true;
      statusEl.classList.remove("error");
      statusEl.textContent = "요청 접수 중...";
      try {
        const response = await fetch(SOURCES.actionEndpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Infinity-Action-Key": actionKey,
          },
          body: JSON.stringify(payload),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) {
          throw new Error(data.error || ("HTTP " + response.status));
        }
        if (data.status === "already_queued") {
          statusEl.textContent = "이미 접수됨";
          return;
        }
        const shortId = String(data.request_id || "").slice(0, 8);
        statusEl.textContent = shortId
          ? "요청 접수됨 · " + shortId
          : "요청 접수됨";
      } catch (error) {
        button.disabled = false;
        statusEl.classList.add("error");
        statusEl.textContent = "접수 실패 · " + (error && error.message ? error.message : "다시 시도 필요");
      }
    }

    function extractLine(sectionText, label) {
      const match = String(sectionText || "").match(new RegExp("^[-*] " + label + ":\\s*(.+)$", "m"));
      return match ? match[1].trim() : "";
    }

    function extractThreadDrafts(text) {
      const source = String(text || "");
      const drafts = [];
      const sectionRe = /^##\s+(C\d+)\s+[—-]\s+(.+?)\n([\s\S]*?)(?=^##\s+C\d+\s+[—-]\s+|\n##\s+7일|\Z)/gm;
      let match;
      while ((match = sectionRe.exec(source))) {
        const id = match[1].trim();
        const title = match[2].trim();
        const body = match[3] || "";
        const code = body.match(/```text\s*([\s\S]*?)```/);
        if (!code || !code[1].trim()) continue;
        drafts.push({
          id,
          title,
          purchase: extractLine(body, "실제 구매 기록"),
          checks: extractLine(body, "게시 전 확인"),
          copy: code[1].trim(),
        });
      }
      return drafts;
    }

    function collectThreadDrafts(bundle) {
      const sources = [];
      if (bundle && bundle.detailText) sources.push(bundle.detailText);
      for (const entry of (bundle && bundle.artifacts || [])) {
        const path = String(entry.path || entry.name || "");
        if (entry.text && /candidate-posts\.md$/.test(path)) sources.push(entry.text);
      }
      const seen = new Set();
      const drafts = [];
      for (const text of sources) {
        for (const draft of extractThreadDrafts(text)) {
          const key = draft.id + "|" + draft.title;
          if (seen.has(key)) continue;
          seen.add(key);
          drafts.push(draft);
        }
      }
      return drafts;
    }

    function addThreadDraftsBlock(drafts) {
      if (!drafts || !drafts.length) return;
      const block = makeBlock("작성 대기중인 Threads", "kind-threads", { expanded: true });
      const host = document.createElement("div");
      host.className = "thread-drafts";
      for (const draft of drafts) {
        const card = document.createElement("article");
        card.className = "thread-draft";
        const title = document.createElement("div");
        title.className = "thread-draft-title";
        title.textContent = draft.id + " · " + draft.title;
        card.appendChild(title);
        const metaText = [
          draft.purchase ? "구매 근거: " + draft.purchase : "",
          draft.checks ? "게시 전 확인: " + draft.checks : "",
        ].filter(Boolean).join("\n");
        if (metaText) {
          const meta = document.createElement("div");
          meta.className = "thread-draft-meta";
          meta.textContent = metaText;
          card.appendChild(meta);
        }
        const copy = document.createElement("pre");

        copy.textContent = draft.copy;
        card.appendChild(copy);

      }
      block.appendChild(host);

    function closeDetailModal() {
      detailModal.classList.remove("open");

    const detailCache = new Map();
    const DETAIL_CACHE_TTL = 5 * 60 * 1000;
    let detailRenderRun = 0;

    function metaValue(item, keys) {
      for (const key of keys) {
        if (item.meta && item.meta[key]) return item.meta[key];
      }
      return "";
    }

    function pathFieldEntries(item, keys, kindClass) {
      const seen = new Set();
      const entries = [];
      for (const key of keys) {
        const path = normalizePath(item.meta && item.meta[key]);
        if (!path || seen.has(path) || !detectKind(path)) continue;
        seen.add(path);
        entries.push({ key, path, kindClass });
      }
      return entries;
    }

    async function fetchPathEntry(path) {
      const normalized = normalizePath(path);
      const kind = detectKind(normalized);
      if (!normalized || !kind) return null;
      const url = SOURCES.rawBase + normalized;
      const name = normalized.split("/").pop();
      if (kind === "image") return { name, kind, url, path: normalized };
      const text = await fetchMaybeText(normalized);
      return text ? { name, kind, text, url, path: normalized } : null;
    }

    async function fetchKnownEntries(entries) {
      const tasks = entries.map(async (entry) => {
        try {
          const fetched = await fetchPathEntry(entry.path);
          return fetched ? Object.assign(fetched, entry) : null;
        } catch (e) {
          return null;
        }
      });
      return (await Promise.all(tasks)).filter(Boolean);
    }

    async function loadDetailBundle(item) {
      const key = (item.id || "") + "|" + (item.source || "") + "|" + (item.title || "");
      const cached = detailCache.get(key);
      if (cached && Date.now() - cached.t < DETAIL_CACHE_TTL) return cached.data;
      const detailPath = normalizePath(item.meta.detail || item.meta.draft || item.path || "");
      const knownArtifactRefs = pathFieldEntries(item, ["artifact", "evidence", "approval_request"], "kind-artifact");
      const knownReportRefs = pathFieldEntries(item, ["report", "red_report", "previous_red_report"], "kind-report");
      const [archive, detailText, knownArtifacts, knownReports] = await Promise.all([
        fetchArchiveIntent(item.id),
        detailPath ? fetchMaybeText(detailPath) : Promise.resolve(null),
        fetchKnownEntries(knownArtifactRefs),
        fetchKnownEntries(knownReportRefs),
      ]);
      let artifacts = knownArtifacts;
      let reports = knownReports;
      if (!artifacts.length) artifacts = await fetchArtifactsList(item.id);
      if (!reports.length) {
        const latestReport = await fetchLatestReport(item.id);
        reports = latestReport ? [latestReport] : [];
      }
      const data = { archive, detailPath, detailText, artifacts, reports };
      detailCache.set(key, { t: Date.now(), data });
      return data;
    }

    function renderImmediateDetail(item, sourceLabel) {
      addStructuredBlock("카드 요약", buildSummaryRows(item, sourceLabel), "kind-summary");
      addActionBlock(item, sourceLabel);
      const st = String(item.meta.status || "").toLowerCase();

    function appendLoadedDetail(item, bundle) {
      const { archive, detailPath, detailText, artifacts, reports } = bundle;

      for (const report of reports) {
        const title = report.path || ("reports/" + item.id + "/" + report.name);
        renderArtifactEntry("Report: " + title, report, "kind-report");
      }

      const archivePath = archive ? normalizePath(archive.path) : "";
      const normalizedDetailPath = normalizePath(detailPath);
      if (archive) addDetailBlock("Intent 원장: " + archive.path, archive.text, "kind-archive");
      if (detailText && normalizedDetailPath !== archivePath) {
        addDetailBlock("상세 파일: " + detailPath, detailText, "kind-detail");
      }
      addThreadDraftsBlock(collectThreadDrafts(bundle));
      for (const a of artifacts) {
        const title = a.path || ("artifacts/" + item.id + "/" + a.name);
        renderArtifactEntry("Artifact: " + title, a, "kind-artifact");
      }

      if (rateLimited) {
        addDetailBlock("GitHub API 제한", "미인증 API 호출(60/시간) 한도에 도달했습니다. 잠시 후 다시 시도해주세요. (artifacts/reports 디렉토리 listing이 누락될 수 있습니다.)", "kind-empty");
      } else if (!archive && !detailText && !artifacts.length && !reports.length) {
        addDetailBlock("추가 상세", "연결된 archive intent / artifacts / reports가 아직 없습니다.", "kind-empty");
      }
