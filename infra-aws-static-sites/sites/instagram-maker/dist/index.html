<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11120f" />
  <title>Frame — Instagram Maker</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">F</span><span>Frame</span><span class="brand-sub">Instagram maker</span></div>
      <div class="status"><span class="status-dot"></span><span id="assetStatus">샘플 이미지로 시작</span></div>
    </header>

    <section class="workspace">
      <aside class="inspector" aria-label="콘텐츠 설정">
        <div class="panel-intro">
          <p class="eyebrow">QUICK COMPOSER</p>
          <h1>한 장을 바로<br /><em>게시 가능한 장면</em>으로.</h1>
          <p class="muted">사진을 넣고, 텍스트 위치와 폰트만 정하면 됩니다.</p>
        </div>

        <div class="control-section">
          <div class="section-heading"><span>01</span><h2>소스</h2></div>
          <label class="upload-drop" for="assetInput">
            <span class="upload-icon">↥</span>
            <span><strong>사진 또는 영상 업로드</strong><small>JPG, PNG, WebP, MP4 · 로컬에서만 처리</small></span>
          </label>
          <input id="assetInput" type="file" accept="image/*,video/*" hidden />
        </div>

        <div class="control-section">
          <div class="section-heading"><span>02</span><h2>템플릿</h2></div>
          <div class="template-list" role="radiogroup" aria-label="템플릿">
            <button class="template-card is-selected" data-template="photo" role="radio" aria-checked="true"><span class="mini-preview mini-photo"><i></i></span><span><strong>Photo Hook</strong><small>사진 위에 크게</small></span><kbd>1</kbd></button>
            <button class="template-card" data-template="shade" role="radio" aria-checked="false"><span class="mini-preview mini-shade"><i></i></span><span><strong>Soft Shade</strong><small>하단 그라디언트</small></span><kbd>2</kbd></button>
            <button class="template-card" data-template="editorial" role="radio" aria-checked="false"><span class="mini-preview mini-editorial"><i></i></span><span><strong>Editorial</strong><small>정제된 자막 카드</small></span><kbd>3</kbd></button>
          </div>
        </div>

        <div class="control-section">
          <div class="section-heading"><span>03</span><h2>자막</h2></div>
          <label class="field-label" for="headline">큰 문구 <span>최대 2~3줄</span></label>
          <textarea id="headline" rows="2">이스탄불에서 오래 남은 건
그날의 빛이었습니다</textarea>
          <label class="field-label" for="caption">하단 본문 <span>선택 · 1~2줄</span></label>
          <textarea id="caption" rows="2">그날의 빛은 사라졌지만,
기억은 오래 남았습니다.</textarea>
          <div class="field-row">
            <div class="field-grow"><label class="field-label" for="fontSelect">폰트</label><select id="fontSelect"><option value="a2z">에이투지체 Black</option><option value="chosun">조선굴림체</option><option value="nanum">나눔스퀘어 네오</option></select></div>
            <div class="field-small"><label class="field-label" for="positionSelect">위치</label><select id="positionSelect"><option value="top">위</option><option value="center" selected>가운데</option><option value="bottom">아래</option></select></div>
          </div>
        </div>

        <div class="control-section export-section">
          <div class="section-heading"><span>04</span><h2>내보내기</h2></div>
          <div class="export-actions"><button id="exportPng" class="button button-primary">PNG 이미지 <span>↗</span></button><button id="exportVideo" class="button button-secondary">WebM 영상 <span>↗</span></button></div>
          <p class="export-note">모든 처리는 브라우저 안에서만 실행됩니다.</p>
        </div>
      </aside>

      <section class="stage-area" aria-label="미리보기">
        <div class="stage-meta"><span>PREVIEW</span><span id="dimensionLabel">1080 × 1920 · 9:16</span></div>
        <div class="stage-wrap"><div class="stage-shadow"></div><canvas id="previewCanvas" width="1080" height="1920" aria-label="콘텐츠 미리보기"></canvas><div id="emptyState" class="empty-state"><span class="empty-cross">+</span><strong>사진을 올려보세요</strong><small>샘플 이미지가 자동으로 표시됩니다</small></div></div>
        <div class="stage-footer"><span id="templateLabel">Photo Hook</span><span class="key-hint"><kbd>R</kbd> 위치 초기화</span></div>
      </section>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
