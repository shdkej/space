<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172321">
  <title>Card News Composer</title>
  <style>
    :root { --ink:#172321; --paper:#f7f3e8; --panel:#fffdf5; --line:rgba(23,35,33,.18); --focus:#2e6659; --accent:#d6ff00; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(135deg,#f8f4e9,#eef2ed); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    button,input,textarea { font:inherit; } button { cursor:pointer; }
    .top { display:flex; justify-content:space-between; gap:16px; align-items:center; max-width:1440px; margin:auto; padding:18px 24px; border-bottom:1px solid var(--line); }
    .top a { color:inherit; font-weight:800; text-decoration:none; } .top strong { display:block; font-size:18px; } .top small { color:#63706c; }
    .shell { display:grid; grid-template-columns:minmax(260px,340px) minmax(0,1fr); gap:26px; max-width:1440px; margin:auto; padding:26px 24px 48px; }
    .controls { align-self:start; position:sticky; top:18px; padding:20px; background:rgba(255,253,245,.86); border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 60px rgba(23,35,33,.09); }
    h1 { margin:0 0 8px; font-size:28px; line-height:1.16; letter-spacing:-.045em; } .lead { margin:0 0 20px; color:#52605b; font-size:14px; line-height:1.55; }
    label { display:block; margin:16px 0 7px; font-size:12px; font-weight:900; letter-spacing:.02em; } input[type=file], textarea { width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; padding:11px; } textarea { min-height:76px; resize:vertical; line-height:1.45; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .button { width:100%; border:1px solid var(--ink); border-radius:10px; padding:12px; background:var(--ink); color:white; font-weight:900; } .button.secondary { background:transparent; color:var(--ink); } .button + .button { margin-top:9px; }
    .hint { margin:14px 0 0; padding:12px; border-left:3px solid var(--accent); background:#f3f7eb; color:#45534d; font-size:12px; line-height:1.55; }
    .stage { min-width:0; } .stage-head { display:flex; justify-content:space-between; gap:16px; align-items:end; margin:0 0 12px; } .stage-head p { margin:0; color:#63706c; font-size:13px; }
    .canvas-wrap { display:grid; place-items:center; min-height:calc(100vh - 150px); padding:22px; background:rgba(255,253,245,.5); border:1px solid var(--line); border-radius:18px; }
    canvas { width:min(100%,600px); height:auto; display:block; background:#d7dfd8; box-shadow:0 26px 80px rgba(23,35,33,.18); touch-action:none; }
    .slides { display:flex; gap:8px; overflow-x:auto; margin-top:14px; padding-bottom:4px; } .slide { flex:0 0 auto; width:74px; padding:0; border:2px solid transparent; border-radius:9px; background:#d8ded5; overflow:hidden; } .slide.active { border-color:var(--focus); } .slide img { display:block; width:70px; aspect-ratio:4/5; object-fit:cover; }
    .status { min-height:18px; margin-top:10px; color:#52605b; font-size:12px; } .mode { display:flex; gap:8px; } .mode button { flex:1; border:1px solid var(--line); border-radius:8px; padding:9px; background:white; font-size:13px; font-weight:800; } .mode button.active { border-color:var(--focus); background:#e7f0eb; }
    @media (max-width:820px) { .shell { grid-template-columns:1fr; padding:18px; } .controls { position:static; } .canvas-wrap { min-height:0; padding:12px; } .top { padding:14px 18px; } }
  </style>
</head>
<body>
  <header class="top"><a href="./index.html"><strong>CN / Card News Library</strong><small>라이브러리로 돌아가기</small></a><small>PHOTO FIRST · 1080 × 1350</small></header>
  <main class="shell">
    <aside class="controls">
      <h1>사진 위에<br>자막을 올립니다.</h1>
      <p class="lead">원본 사진은 그대로 두고, 각 카드의 제목·본문을 별도 레이어로 배치합니다.</p>
      <label for="photos">사진 카드</label><input id="photos" type="file" accept="image/*" multiple>
      <label for="title">제목</label><textarea id="title" placeholder="카드의 큰 문구를 입력하세요"></textarea>
      <label for="caption">본문 자막</label><textarea id="caption" placeholder="짧은 본문 또는 보조 문구를 입력하세요"></textarea>
      <label>움길 자막</label><div class="mode"><button type="button" data-layer="title" class="active">제목</button><button type="button" data-layer="caption">본문</button></div>
      <div class="row"><div><label for="titleSize">제목 크기</label><input id="titleSize" type="range" min="44" max="120" value="84"></div><div><label for="captionSize">본문 크기</label><input id="captionSize" type="range" min="24" max="54" value="34"></div></div>
      <button class="button" id="exportPng" type="button">현재 카드 PNG 저장</button><button class="button secondary" id="exportJson" type="button">자막 위치 JSON 저장</button><label for="importJson">저장한 위치 불러오기</label><input id="importJson" type="file" accept="application/json,.json">
      <p class="hint">캔버스에서 선택한 자막을 드래그하세요. 위치는 사진별로 브라우저에 보관됩니다. PNG와 JSON을 함께 저장하면 다음 렌더에서도 같은 위치를 적용할 수 있습니다.</p>
      <p class="status" id="status" aria-live="polite">사진을 선택해 시작하세요.</p>
    </aside>
    <section class="stage"><div class="stage-head"><div><strong>카드 미리보기</strong><p>점선 박스는 편집 중인 자막입니다. PNG에는 포함되지 않습니다.</p></div><p id="counter"></p></div><div class="canvas-wrap"><canvas id="canvas" width="1080" height="1350" aria-label="카드 편집 캔버스"></canvas></div><div class="slides" id="slides" aria-label="카드 선택"></div></section>
  </main>
  <script>
  (() => {
    const W=1080,H=1350, STORE='card-news-composer-v1';
    const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
    const el={ photos:document.querySelector('#photos'), importJson:document.querySelector('#importJson'), title:document.querySelector('#title'), caption:document.querySelector('#caption'), titleSize:document.querySelector('#titleSize'), captionSize:document.querySelector('#captionSize'), slides:document.querySelector('#slides'), status:document.querySelector('#status'), counter:document.querySelector('#counter') };
    const saved=JSON.parse(localStorage.getItem(STORE)||'{}');
    const state={cards:[], index:0, layer:'title', drag:null};
    const defaults={title:'',caption:'',titleX:.5,titleY:.58,captionX:.5,captionY:.82,titleSize:84,captionSize:34};
    const current=()=>state.cards[state.index];
    const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
    function lines(text,size,max=3){const limit=Math.max(4,Math.floor(W*.78/size));const out=[];String(text||'').replace(/\r/g,'').split('\n').map(v=>v.trim()).filter(Boolean).forEach(line=>{while(line.length&&out.length<max){out.push(line.slice(0,limit));line=line.slice(limit);}});return out;}
    function cover(img){ const scale=Math.max(W/img.naturalWidth,H/img.naturalHeight), w=img.naturalWidth*scale,h=img.naturalHeight*scale; ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h); }
    function drawText(text,x,y,size,weight='800') { const ls=lines(text,size), lh=size*1.14; ctx.save();ctx.font=`${weight} ${size}px Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(2,size*.055);ctx.strokeStyle='rgba(0,0,0,.72)';ctx.fillStyle='#fffdf5';const start=y-(ls.length-1)*lh/2;ls.forEach((line,i)=>{ctx.strokeText(line,x,start+i*lh);ctx.fillText(line,x,start+i*lh)});const textWidth=Math.max(...ls.map(line=>ctx.measureText(line).width),0);ctx.restore(); return {w:Math.min(W*.84,textWidth+size*.9),h:Math.max(size*1.6,ls.length*lh+size*.4)}; }
    function boundsFor(text,size){const ls=lines(text,size),width=Math.min(W*.84,Math.max(...ls.map(line=>line.length*size),0)+size*.9),height=Math.max(size*1.6,ls.length*size*1.14+size*.4);return {x:width/(2*W),y:height/(2*H)};}
    function render(showSelection=true){ const card=current();ctx.clearRect(0,0,W,H); if(!card){ctx.fillStyle='#d8ded5';ctx.fillRect(0,0,W,H);ctx.fillStyle='#40514a';ctx.textAlign='center';ctx.font='700 42px sans-serif';ctx.fillText('사진을 선택해 시작하세요',W/2,H/2);return;} cover(card.image); const titleBox=drawText(card.title,card.titleX*W,card.titleY*H,card.titleSize); const capBox=drawText(card.caption,card.captionX*W,card.captionY*H,card.captionSize,'600'); if(showSelection){const box=state.layer==='title'?titleBox:capBox; const x=(state.layer==='title'?card.titleX:card.captionX)*W,y=(state.layer==='title'?card.titleY:card.captionY)*H;ctx.save();ctx.setLineDash([12,10]);ctx.strokeStyle='#d6ff00';ctx.lineWidth=4;ctx.strokeRect(x-box.w/2,y-box.h/2,box.w,box.h);ctx.restore();}el.counter.textContent=`${state.index+1} / ${state.cards.length}`; }
    function syncInputs(){const c=current(); if(!c)return; el.title.value=c.title;el.caption.value=c.caption;el.titleSize.value=c.titleSize;el.captionSize.value=c.captionSize;}
    function persist(){const data={};state.cards.forEach(c=>data[c.key]={title:c.title,caption:c.caption,titleX:c.titleX,titleY:c.titleY,captionX:c.captionX,captionY:c.captionY,titleSize:c.titleSize,captionSize:c.captionSize});localStorage.setItem(STORE,JSON.stringify(data));}
    function renderSlides(){el.slides.innerHTML=state.cards.map((c,i)=>`<button class="slide ${i===state.index?'active':''}" data-index="${i}" type="button" aria-label="카드 ${i+1}"><img src="${c.url}" alt="카드 ${i+1}"></button>`).join('');}
    function setCard(i){state.index=i;syncInputs();renderSlides();render();}
    function addFiles(files){const entries=[...files].filter(f=>f.type.startsWith('image/'));let pending=entries.length;if(!pending)return;entries.forEach((file,i)=>{const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{const key=`${file.name}-${file.size}-${file.lastModified}`;state.cards.push({file,key,url,image,...defaults,...(saved[key]||{})});if(--pending===0){setCard(0);el.status.textContent=`${state.cards.length}장의 사진을 불러왔습니다. 카드마다 자막 위치를 조절하세요.`;}};image.src=url;});}
    function point(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height};}
    canvas.addEventListener('pointerdown',ev=>{if(!current())return;state.drag=point(ev);canvas.setPointerCapture(ev.pointerId)});
    canvas.addEventListener('pointermove',ev=>{if(!state.drag||!current())return;const p=point(ev),c=current(),dx=p.x-state.drag.x,dy=p.y-state.drag.y;const px=state.layer==='title'?'titleX':'captionX',py=state.layer==='title'?'titleY':'captionY',text=state.layer==='title'?c.title:c.caption,size=state.layer==='title'?c.titleSize:c.captionSize,bounds=boundsFor(text,size);c[px]=clamp(c[px]+dx/W,bounds.x,1-bounds.x);c[py]=clamp(c[py]+dy/H,bounds.y,1-bounds.y);state.drag=p;persist();render();});
    canvas.addEventListener('pointerup',()=>state.drag=null);canvas.addEventListener('pointercancel',()=>state.drag=null);
    el.photos.addEventListener('change',e=>addFiles(e.target.files));el.slides.addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b)setCard(Number(b.dataset.index));});
    document.querySelectorAll('[data-layer]').forEach(b=>b.addEventListener('click',()=>{state.layer=b.dataset.layer;document.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('active',x===b));render();}));
    [[el.title,'title'],[el.caption,'caption'],[el.titleSize,'titleSize'],[el.captionSize,'captionSize']].forEach(([input,key])=>input.addEventListener('input',()=>{if(!current())return;current()[key]=key.endsWith('Size')?Number(input.value):input.value;persist();render();}));
    el.importJson.addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());let applied=0;(data.cards||[]).forEach(layout=>{const card=state.cards.find(c=>c.file.name===layout.source_file);const cap=layout.caption;if(card&&cap){Object.assign(card,{title:cap.title||'',caption:cap.body||'',titleX:Number(cap.title_x),titleY:Number(cap.title_y),captionX:Number(cap.body_x),captionY:Number(cap.body_y),titleSize:Number(cap.title_size),captionSize:Number(cap.body_size)});applied++;}});persist();syncInputs();render();el.status.textContent=applied?`${applied}장의 저장한 위치를 적용했습니다.`:'같은 사진 파일을 먼저 선택한 뒤 다시 불러오세요.';}catch(error){el.status.textContent='위치 JSON을 읽지 못했습니다. 저장한 파일인지 확인하세요.';}});
    document.querySelector('#exportPng').addEventListener('click',()=>{if(!current())return;render(false);canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`card-${String(state.index+1).padStart(2,'0')}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);render();},'image/png');});
    document.querySelector('#exportJson').addEventListener('click',()=>{if(!state.cards.length)return;const data={version:1,canvas:{width:W,height:H},cards:state.cards.map((c,i)=>({index:i+1,source_file:c.file.name,caption:{title:c.title,body:c.caption,title_x:c.titleX,title_y:c.titleY,body_x:c.captionX,body_y:c.captionY,title_size:c.titleSize,body_size:c.captionSize}}))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='card-caption-layouts.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
    render();
  })();
  </script>
</body>
</html>
