<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9f9f7">
<title>서랍 · Minimal Collector</title>
<link rel="stylesheet" href="style.css"><script src="studio.js" defer></script>
</head>
<body class="studio">
<header class="room-header"><a href="./" aria-label="입구로 돌아가기"><span aria-hidden="true">←</span> Minimal Collector</a><h1>서랍</h1></header>
<main class="cabinet" aria-label="주제별 서랍"></main>
<dialog class="viewing" aria-labelledby="piece-title">
  <button class="close-view" type="button" aria-label="감상 종료">닫기 ×</button>
  <figure><div class="mount"><img alt=""></div>
    <figcaption><p class="category"></p><h2 id="piece-title"></h2><p class="description"></p>
    <nav aria-label="전시물 이동"><button type="button" class="previous" aria-label="이전 전시물">←</button><span class="position"></span><button type="button" class="next" aria-label="다음 전시물">→</button></nav>
    </figcaption>
  </figure>
</dialog>
<noscript><p>서랍을 열려면 자바스크립트를 켜 주세요.</p></noscript>
</body></html>
