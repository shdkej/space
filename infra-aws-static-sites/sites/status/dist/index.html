<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Space Status</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #eef8f5;
        --ink: #26332f;
        --muted: rgba(48, 72, 66, 0.74);
        --faint: rgba(58, 89, 82, 0.58);
        --ok: #4f9d8a;
        --warn: #d9a84e;
        --bad: #c96f5f;
        --gold: #d7b56b;
        --gold-soft: rgba(215, 181, 107, 0.42);
        --holo-ink: #3b3e3d;
        /* blur를 걷어낸 맑은 투명 — 물빛만 얹고 밀키한 불투명감은 만들지 않는다 */
        --glass: rgba(247, 255, 252, 0.3);
        --glass-strong: rgba(247, 255, 252, 0.44);
        --glass-border: rgba(170, 226, 211, 0.58);
        --glass-blur: none;
        --shadow-soft: 0 12px 34px rgba(48, 97, 92, 0.13);
        --focus: #2f8f7b;
        --attention: #b9822b;
        --critical: #a95448;
        --photo-veil: rgba(238, 248, 245, 0.28);
        --radius: 14px;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --sans: "Pretendard", ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
      }

      body {
        color: var(--ink);
        font-family: var(--sans);
        font-feature-settings: "tnum";
        -webkit-font-smoothing: antialiased;
        background:
          linear-gradient(90deg, rgba(250, 252, 249, 0.88) 0%, rgba(250, 252, 249, 0.54) 42%, rgba(250, 252, 249, 0.16) 100%),
          linear-gradient(180deg, rgba(252, 253, 250, 0.08) 0%, rgba(238, 235, 218, 0.16) 62%, rgba(68, 67, 57, 0.26) 100%),
          url("assets/mascot-ambient.jpg") center / cover no-repeat,
          linear-gradient(168deg, #fbfdfa 0%, #f1f1ea 48%, #e7e8df 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 16% 12%, rgba(255, 255, 255, 0.66), transparent 34%),
          radial-gradient(ellipse at 74% 68%, rgba(79, 75, 54, 0.18), transparent 46%),
          linear-gradient(112deg, transparent 0 18%, var(--gold-soft) 19% 20%, transparent 21% 42%, rgba(215, 181, 107, 0.22) 43% 44%, transparent 45%),
          linear-gradient(168deg, transparent 0 28%, rgba(170, 158, 113, 0.12) 29% 30%, transparent 31% 63%, rgba(215, 181, 107, 0.18) 64% 65%, transparent 66%),
          radial-gradient(circle at 82% 24%, rgba(255, 255, 255, 0.78), transparent 3%),
          radial-gradient(circle at 63% 37%, rgba(255, 255, 255, 0.52), transparent 2.5%);
        opacity: 0.86;
        mix-blend-mode: screen;
      }

      /* The user's mascot is the spatial layer for Status. The former Saem
         procedural scene remains in the DOM only as a safe rollback seam. */
      .saem-canvas,
      .saem-fallback {
        display: none !important;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(circle at 50% 42%, transparent 0 22%, rgba(255, 255, 255, 0.04) 42%, rgba(80, 78, 68, 0.16) 100%);
        mix-blend-mode: soft-light;
      }

      a,
      button {
        color: inherit;
        font: inherit;
      }

      button {
        border: 0;
        background: none;
        padding: 0;
      }

      /* ─── 배경 레이어: Three.js 캔버스 ───────────── */
      .saem-canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100svh;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.9s var(--ease);
      }

      body[data-scene="webgl"] .saem-canvas {
        opacity: 1;
      }

      /* ─── CSS 샘 fallback (WebGL 실패 시 그대로 남는다) ─ */
      .saem-fallback {
        position: fixed;
        z-index: 0;
        left: 50%;
        bottom: 34svh;
        width: 180px;
        height: 190px;
        transform: translateX(-50%);
        pointer-events: none;
      }

      body[data-scene="webgl"] .saem-fallback {
        display: none;
      }

      .saem-fallback .water {
        position: absolute;
        left: 50%;
        bottom: -14px;
        width: 300px;
        height: 74px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(215, 241, 233, 0.92), rgba(215, 241, 233, 0) 70%);
      }

      .saem-fallback .ripple {
        position: absolute;
        left: 50%;
        bottom: 12px;
        width: 150px;
        height: 40px;
        border: 1.5px solid rgba(166, 226, 210, 0.78);
        border-radius: 50%;
        transform: translateX(-50%) scale(0.6);
        opacity: 0;
        animation: saemRipple 5.2s linear infinite;
      }

      .saem-fallback .ripple:nth-child(3) {
        animation-delay: 2.6s;
      }

      @keyframes saemRipple {
        0% {
          opacity: 0.7;
          transform: translateX(-50%) scale(0.55);
        }

        100% {
          opacity: 0;
          transform: translateX(-50%) scale(1.9);
        }
      }

      .saem-fallback .pebble {
        position: absolute;
        left: 50%;
        bottom: 22px;
        width: 128px;
        height: 96px;
        transform: translateX(-50%);
        border-radius: 52% 48% 50% 50% / 58% 60% 42% 44%;
        background: linear-gradient(155deg, #e7e1d6 8%, #d9d2c6 52%, #c5bdad 100%);
        box-shadow: 0 18px 30px rgba(58, 103, 96, 0.18);
        animation: saemBreathe 6s ease-in-out infinite;
      }

      @keyframes saemBreathe {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }

        50% {
          transform: translateX(-50%) translateY(-3px);
        }
      }

      .saem-fallback .pebble.is-poked {
        animation: saemPoke 0.55s var(--ease);
      }

      @keyframes saemPoke {
        0%,
        100% {
          transform: translateX(-50%) scale(1, 1);
        }

        30% {
          transform: translateX(-50%) scale(1.08, 0.86);
        }

        62% {
          transform: translateX(-50%) scale(0.96, 1.05);
        }
      }

      .saem-fallback .moss {
        position: absolute;
        left: 50%;
        top: -12px;
        width: 74px;
        height: 34px;
        transform: translateX(-54%);
        border-radius: 50% 50% 46% 46% / 74% 78% 30% 30%;
        background: linear-gradient(160deg, #7eb89f, #4f9d8a 70%);
      }

      .saem-fallback .sprout {
        position: absolute;
        left: 44%;
        top: -30px;
        width: 3px;
        height: 20px;
        border-radius: 999px;
        background: #4f9d8a;
      }

      .saem-fallback .sprout::before,
      .saem-fallback .sprout::after {
        content: "";
        position: absolute;
        top: -4px;
        width: 13px;
        height: 7px;
        border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
        background: #4f9d8a;
      }

      .saem-fallback .sprout::before {
        left: -11px;
        transform: rotate(-32deg);
      }

      .saem-fallback .sprout::after {
        left: 2px;
        transform: rotate(32deg);
      }

      .saem-fallback .eye {
        position: absolute;
        top: 40%;
        width: 7px;
        height: 8px;
        border-radius: 50%;
        background: #4a4238;
      }

      .saem-fallback .eye.left {
        left: 32%;
      }

      .saem-fallback .eye.right {
        right: 32%;
      }

      /* ─── HUD ──────────────────────────────────── */
      .app-shell {
        position: relative;
        z-index: 10;
        width: 100vw;
        height: 100svh;
        isolation: isolate;
      }

      .app-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.18), transparent 44%, rgba(255, 255, 255, 0.08));
      }

      .overview {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 10px;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        transition: transform 0.62s var(--ease), opacity 0.42s var(--ease), filter 0.42s var(--ease);
      }

      body[data-mode="detail"] .overview {
        opacity: 0;
        filter: blur(12px);
        transform: scale(0.965) translateY(-18px);
        pointer-events: none;
      }

      .hero-copy {
        min-width: 0;
        justify-self: start;
        display: grid;
        align-content: start;
        gap: 12px;
        padding: 18px 22px 20px;
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        background: rgba(250, 252, 247, 0.3);
        border-color: rgba(215, 181, 107, 0.4);
        box-shadow: var(--shadow-soft);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      .hero-kicker,
      .hero-line,
      .hero-meta-line {
        overflow: hidden;
      }

      .hero-kicker {
        color: color-mix(in srgb, var(--holo-ink), var(--gold) 32%);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .hero-title {
        max-width: min(15ch, 100%);
        margin: 0;
        font-size: clamp(30px, 3.6rem, 58px);
        line-height: 0.98;
        font-weight: 430;
        letter-spacing: 0;
        color: rgba(37, 53, 48, 0.96);
        text-wrap: balance;
      }

      .hero-title .hero-emphasis {
        font-weight: 760;
        color: var(--holo-ink);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.72);
      }

      .hero-line {
        display: block;
      }

      .hero-line + .hero-line {
        margin-top: 0.06em;
      }

      .hero-lead {
        max-width: min(46ch, 100%);
        margin: 0;
        color: var(--muted);
        font-size: clamp(12px, 0.94rem, 15px);
        line-height: 1.42;
        letter-spacing: 0;
      }

      .hero-meta {
        display: grid;
        gap: 3px;
        min-width: 0;
        color: var(--faint);
        font-size: 10px;
        line-height: 1.35;
      }

      .hero-meta strong {
        color: rgba(34, 72, 65, 0.88);
        font-weight: 650;
      }

      [data-reveal] .reveal-word {
        display: inline-block;
        opacity: 1;
        transform: none;
        filter: none;
        animation: revealWord 0.84s var(--ease) forwards;
        animation-delay: calc(var(--word-index, 0) * 52ms + var(--reveal-delay, 0ms));
        will-change: transform, opacity, filter;
      }

      [data-reveal] .reveal-space {
        display: inline-block;
        width: 0.28em;
      }

      @keyframes revealWord {
        0% {
          opacity: 0;
          transform: translate3d(0, 1.1em, 0);
          filter: blur(8px);
        }

        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0);
          filter: blur(0);
        }
      }

      /* ─── philosophy cards: Minimal · Balance · Loop ─ */
      .overview-grid {
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-self: end;
        gap: 10px;
        height: min(26svh, 210px);
      }

      .control-card {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 10px;
        padding: 16px 17px 15px;
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        background: var(--glass);
        box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.52);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        cursor: pointer;
        text-align: left;
        transition:
          transform 0.28s var(--ease),
          border-color 0.28s var(--ease),
          background 0.28s var(--ease),
          box-shadow 0.28s var(--ease);
      }

      @media (hover: hover) and (pointer: fine) {
        .control-card:hover {
          transform: translateY(-3px);
          border-color: rgba(215, 181, 107, 0.78);
          background: rgba(250, 252, 247, 0.48);
          box-shadow: 0 18px 40px rgba(48, 97, 92, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.58);
        }
      }

      :where(button, a):focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .control-card:focus-visible {
        border-color: color-mix(in srgb, var(--focus), white 18%);
        background: rgba(250, 252, 247, 0.5);
      }

      .control-card.is-active {
        animation: cardPulse 0.48s var(--ease);
      }

      @keyframes cardPulse {
        0% {
          transform: scale(1);
        }

        44% {
          transform: scale(0.965);
        }

        100% {
          transform: scale(1.015);
        }
      }

      .card-top {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .card-label {
        overflow: hidden;
        color: var(--faint);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-mid {
        display: grid;
        align-content: end;
        gap: 7px;
        min-width: 0;
      }

      .card-value {
        display: -webkit-box;
        overflow: hidden;
        font-size: clamp(19px, 1.88rem, 30px);
        font-weight: 760;
        line-height: 1.04;
        letter-spacing: 0;
        color: rgba(28, 50, 46, 0.96);
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .card-title {
        overflow: hidden;
        color: var(--muted);
        font-size: clamp(11px, 0.82rem, 13px);
        font-weight: 600;
        letter-spacing: 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-bottom {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        color: var(--faint);
        font-size: 10px;
        font-weight: 650;
      }

      .card-bottom .card-status {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .dot {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--faint);
      }

      .dot.ok {
        background: var(--ok);
      }

      .dot.warn {
        background: var(--warn);
      }

      .dot.bad {
        background: var(--bad);
      }

      /* ─── detail ───────────────────────────────── */
      .detail-view {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        padding: max(16px, env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom));
        opacity: 0;
        transform: translateY(24px);
        transition: transform 0.62s var(--ease), opacity 0.42s var(--ease);
        pointer-events: none;
        z-index: 1;
      }

      body[data-mode="detail"] .detail-view {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }

      .detail-head {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }

      .icon-button {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        background: var(--glass);
        box-shadow: var(--shadow-soft);
        cursor: pointer;
        font-size: 18px;
        color: rgba(38, 66, 60, 0.9);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      .detail-title {
        min-width: 0;
      }

      .detail-title h1 {
        margin: 0;
        overflow: hidden;
        font-size: 22px;
        line-height: 1.08;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: rgba(28, 50, 46, 0.96);
      }

      .detail-title p {
        margin: 4px 0 0;
        color: var(--muted);
        display: -webkit-box;
        overflow: hidden;
        font-size: 11px;
        line-height: 1.35;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .detail-score {
        min-width: 56px;
        padding: 9px 11px;
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        background: var(--glass);
        box-shadow: var(--shadow-soft);
        font-size: 17px;
        font-weight: 800;
        text-align: center;
        color: rgba(28, 50, 46, 0.96);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      .detail-scroll {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 2px 0 14px;
        scrollbar-width: thin;
      }

      .detail-panel {
        display: none;
        animation: pageIn 0.42s var(--ease);
      }

      .detail-panel.is-current {
        display: block;
      }

      /* opacity를 건드리면 backdrop-filter가 애니메이션 끝에 갑자기 켜져
         글래스가 "불투명해지는" 팝이 생긴다 — transform만 움직인다 */
      @keyframes pageIn {
        from {
          transform: translateY(10px);
        }

        to {
          transform: none;
        }
      }

      .summary-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 10px;
      }

      .attention-block {
        margin-bottom: 14px;
      }

      .group-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0 8px;
        color: rgba(28, 50, 46, 0.96);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .group-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(38, 51, 47, 0.18);
      }

      .group-title.is-attention {
        color: var(--attention);
      }

      .list-stack + .group-title {
        margin-top: 18px;
      }

      .summary-tile,
      .list-row {
        border: 1px solid var(--glass-border);
        border-radius: var(--radius);
        background: var(--glass);
        box-shadow: var(--shadow-soft);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }

      .summary-tile {
        min-width: 0;
        padding: 11px;
      }

      .summary-k {
        overflow: hidden;
        color: var(--faint);
        font-size: 10px;
        font-weight: 800;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .summary-v {
        margin-top: 7px;
        overflow: hidden;
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
        color: rgba(28, 50, 46, 0.96);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .list-stack {
        display: grid;
        gap: 8px;
      }

      .list-row {
        min-width: 0;
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 12px;
        text-decoration: none;
      }

      .row-main {
        min-width: 0;
      }

      .row-name {
        overflow: hidden;
        font-size: 13px;
        font-weight: 750;
        line-height: 1.2;
        color: rgba(28, 50, 46, 0.94);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-detail {
        display: -webkit-box;
        margin-top: 4px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.42;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .row-meta {
        max-width: 128px;
        overflow: hidden;
        padding: 6px 9px;
        border: 1px solid var(--glass-border);
        border-radius: 999px;
        background: rgba(247, 255, 252, 0.4);
        color: rgba(48, 82, 74, 0.82);
        font-size: 10px;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      button.list-row {
        width: 100%;
        text-align: left;
      }

      .list-row.is-clickable {
        cursor: pointer;
        transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
      }

      @media (hover: hover) and (pointer: fine) {
        .list-row.is-clickable:hover {
          border-color: rgba(190, 241, 226, 0.9);
          background: var(--glass-strong);
        }
      }

      .list-row:focus-visible {
        border-color: color-mix(in srgb, var(--focus), white 12%);
        background: rgba(247, 255, 252, 0.56);
      }

      .list-row.is-clickable .row-meta::after {
        content: " ›";
        font-weight: 800;
      }

      /* ─── reason modal (판정 근거) ─────────────── */
      .reason-modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(28, 53, 49, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.24s var(--ease);
      }

      .reason-modal.is-open {
        opacity: 1;
        pointer-events: auto;
      }

      .reason-card {
        width: min(420px, 100%);

      /* Spatial Type surface: text is the primary object; controls appear as

      body {

      .overview {

    </style>
  </head>
  <body data-mode="overview">
    <canvas class="saem-canvas" id="saemCanvas" aria-hidden="true"></canvas>

    <div class="saem-fallback" aria-hidden="true">
      <div class="water"></div>

      <div class="ripple"></div>

        <div class="eye right"></div>

    <main class="app-shell">
      <section class="overview" aria-label="Status overview">
        <header class="hero-copy" id="heroCopy" aria-label="Space status hero">

            Surfaces, agent lanes, and deploy targets in one quiet view.

            <div class="hero-meta-line" id="heroMetaStats" data-reveal="words" style="--reveal-delay: 620ms">Surfaces / loading</div>
            <div class="hero-meta-line" id="updatedAt" data-reveal="words" style="--reveal-delay: 720ms">Updated / loading</div>
          </div>
        </header>

        <section class="overview-grid" id="overviewGrid" aria-label="Status philosophy cards"></section>
      </section>

      <section class="detail-view" aria-label="Status detail">
        <header class="detail-head">
          <button class="icon-button" id="backButton" type="button" aria-label="첫 화면으로 돌아가기">‹</button>
          <div class="detail-title">
            <h1 id="detailTitle">Status</h1>

        <div class="reason-card">
          <header class="reason-head">
            <span class="dot" id="reasonDot"></span>
            <h2 class="reason-title" id="reasonTitle"></h2>
            <button class="icon-button" id="reasonClose" type="button" aria-label="닫기">×</button>
          </header>
          <p class="reason-state" id="reasonState"></p>
          <p class="reason-body" id="reasonBody"></p>

    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const tabs = [
        { id: "system", label: "System" },
        { id: "surfaces", label: "Surfaces" },
        { id: "agents", label: "Agents" },
        { id: "output", label: "Output" },
      ];
      let currentTab = "system";
      let model = null;

      const safe = (value) =>
        String(value ?? "").replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[ch]);

      const host = (url) => {
        try {
          return new URL(url).hostname;
        } catch (error) {
          return url || "";
        }
      };

      const stamp = (iso) => {
        if (!iso) return "--";
        return new Date(iso).toLocaleString("ko-KR", {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      };

      const stateClass = (state) =>
        state === "ok" ? "ok" : state === "warn" ? "warn" : state === "none" ? "" : "bad";
      const stateLabel = (state) => (state === "ok" ? "Operational" : state === "warn" ? "Attention" : state === "none" ? "No data" : "Down");

      const ageMinutes = (isoStr) => {
        if (!isoStr) return null;
        const time = new Date(isoStr).getTime();
        if (!Number.isFinite(time)) return null;
        return Math.max(0, Math.round((Date.now() - time) / 60000));
      };

      const relFromMinutes = (minutes) => {
        if (minutes == null) return "never";
        if (minutes < 1) return "just now";
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.round(minutes / 60);
        if (hours < 48) return `${hours}h ago`;
        return `${Math.round(hours / 24)}d ago`;
      };

      const rel = (isoStr) => relFromMinutes(ageMinutes(isoStr));

      const relHours = (hours) => {
        if (hours == null) return "never";
        if (hours < 1) return "under 1h";
        if (hours < 48) return `${Math.round(hours)}h ago`;
        return `${Math.round(hours / 24)}d ago`;
      };

      const freshness = (minutes, freshAt = 30, agingAt = 120) => {
        if (minutes == null) return { state: "warn", label: "unknown", text: "unknown" };
        if (minutes <= freshAt) return { state: "ok", label: "fresh", text: `fresh · ${relFromMinutes(minutes)}` };
        if (minutes <= agingAt) return { state: "warn", label: "aging", text: `aging · ${relFromMinutes(minutes)}` };
        return { state: "bad", label: "stale", text: `stale · ${relFromMinutes(minutes)}` };
      };

      const outputAction = (item) => {
        if (item.state === "bad") return "다음 조치: 재실행 필요";
        if (item.state === "warn") return "다음 조치: 주기 확인";
        return "정상 주기 안에 있습니다";
      };

      const LIVE_FRESH_MINUTES = 30;
      const LAYER_DETAIL = {
        l1: "삶 — PDCA 4지표(방향·다음 액션·선택·요청 부합) 판정",
        l2: "업·시스템 — 크론과 백로그의 worst 롤업",
        l3: "워크플로우 — 검증→개선 루프가 닫히고 있는가",
        l4: "아티팩트 — 산출물 신선도 (Output 탭과 같은 소스)",
      };

      async function loadAgentsLive() {
        try {
          const res = await fetch("./agents-live.json", { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!Array.isArray(data.agents) || data.agents.length === 0) throw new Error("empty");
          const age = ageMinutes(data.generatedAt);
          return {
            live: age != null && age <= LIVE_FRESH_MINUTES,
            ageMinutes: age,
            generatedAt: data.generatedAt,
            agents: data.agents,
            outputs: Array.isArray(data.outputs) ? data.outputs : [],
            system: data.system || null,
          };
        } catch (_error) {
          return { live: false, ageMinutes: null, generatedAt: null, agents: null, outputs: [], system: null };
        }
      }

      function applyReveal(root) {
        if (!root) return;
        const targets = root.querySelectorAll("[data-reveal]");
        targets.forEach((el) => {
          const source = el.dataset.sourceText || el.textContent;
          const words = String(source || "").trim().split(/\s+/).filter(Boolean);
          el.dataset.sourceText = source;
          el.textContent = "";
          words.forEach((word, index) => {
            const span = document.createElement("span");
            span.className = "reveal-word";
            span.style.setProperty("--word-index", index);
            span.textContent = word;
            el.appendChild(span);
            if (index < words.length - 1) {
              const gap = document.createElement("span");
              gap.className = "reveal-space";
              gap.textContent = " ";
              el.appendChild(gap);
            }
          });
        });
      }

      function flash() {
        const el = $("transitionFlash");
        el.classList.remove("is-on");
        void el.offsetWidth;
        el.classList.add("is-on");
      }

      function summaryTile(key, value) {
        return `
          <div class="summary-tile">
            <div class="summary-k">${safe(key)}</div>
            <div class="summary-v">${safe(value)}</div>
          </div>
        `;
      }

      function row(item, meta, href) {
        const clickable = !href && Boolean(item.reason);
        const tag = href ? "a" : clickable ? "button" : "div";
        const attrs = href
          ? ` href="${safe(href)}"`
          : clickable
            ? ` type="button" data-name="${safe(item.name)}" data-state="${safe(item.state)}" data-reason="${safe(item.reason)}" aria-haspopup="dialog" aria-label="${safe(item.name)} 판정 근거 보기"`
            : "";
        return `
          <${tag} class="list-row${clickable ? " is-clickable" : ""}"${attrs}>
            <span class="dot ${stateClass(item.state)}"></span>
            <div class="row-main">
              <div class="row-name">${safe(item.name)}</div>
              <div class="row-detail">${safe(item.detail || host(item.url) || item.hosting || "")}</div>
            </div>
            <div class="row-meta">${safe(meta)}</div>
          </${tag}>
        `;
      }

      let lastReasonTrigger = null;

      function openReason(dataset, trigger) {
        lastReasonTrigger = trigger || document.activeElement;
        $("reasonDot").className = `dot ${stateClass(dataset.state)}`;
        $("reasonTitle").textContent = dataset.name;
        $("reasonState").textContent = dataset.state === "none" ? "No data" : stateLabel(dataset.state);
        $("reasonState").className = `reason-state ${stateClass(dataset.state)}`;
        $("reasonBody").textContent = dataset.reason;
        $("reasonModal").classList.add("is-open");
        $("reasonModal").setAttribute("aria-hidden", "false");
        $("reasonClose").focus();
      }

      function closeReason() {
        $("reasonModal").classList.remove("is-open");
        $("reasonModal").setAttribute("aria-hidden", "true");
        if (lastReasonTrigger && typeof lastReasonTrigger.focus === "function") {
          lastReasonTrigger.focus();
        }
        lastReasonTrigger = null;
      }

      function card(item) {
        return `
          <button class="control-card" type="button" data-tab="${safe(item.id)}" aria-label="${safe(item.label)} 상세 보기">
            <span class="card-top">
              <span class="dot ${stateClass(item.state)}"></span>
              <span class="card-label">${safe(item.label)}</span>
            </span>
            <span class="card-mid">
              <span class="card-value">${safe(item.value)}</span>
              <span class="card-title">${safe(item.title)}</span>
            </span>
            <span class="card-bottom">
              <span class="card-status">${safe(item.status)}</span>
            </span>
          </button>
        `;
      }

      function buildModel(data, liveFeed) {
        const overall = data.overall || {};
        const checks = data.checks || [];
        const hasFeed = Boolean(Array.isArray(liveFeed?.agents) && liveFeed.agents.length > 0);
        const isLive = Boolean(liveFeed?.live);
        const outputs = (hasFeed ? liveFeed.outputs : []) || [];
        const sys = hasFeed && liveFeed.system && Array.isArray(liveFeed.system.layers) ? liveFeed.system : null;
        const snapshotAge = ageMinutes(data.generatedAt);
        const snapshotFresh = freshness(snapshotAge);
        const agentFresh = freshness(liveFeed?.ageMinutes, LIVE_FRESH_MINUTES, 60);
        const okChecks = checks.filter((item) => item.state === "ok").length;
        const nonOkChecks = checks.filter((item) => item.state !== "ok");
        const freshOutputs = outputs.filter((item) => item.state === "ok").length;
        const nonOkOutputs = outputs.filter((item) => item.state !== "ok");
        const layers = sys?.layers || [];
        const okLayers = layers.filter((item) => item.state === "ok");
        const nonOkLayers = layers.filter((item) => item.state !== "ok");
        const outputRatio = outputs.length ? `${freshOutputs}/${outputs.length}` : "--";
        const avgLatency = checks.length
          ? Math.round(checks.reduce((sum, item) => sum + (item.latencyMs || 0), 0) / checks.length)
          : 0;
        const score = Number.isFinite(Number(overall.score)) ? Number(overall.score) : 0;
        const agents = hasFeed
          ? liveFeed.agents.map((a) => ({
              name: `${a.emoji ? a.emoji + " " : ""}${a.name}`,
              state: a.state,
              detail: a.crons > 0
                ? `${a.crons} cron loops · last activity ${rel(a.lastActivityAt)}`
                : "수동 호출형 · 예약 루프 없음",
              meta: a.crons > 0 ? `${a.crons} loops` : "on demand",
              group: a.crons > 0 ? "Scheduled" : "On demand",
            }))
          : (data.agents || []).map((a) => ({ ...a, meta: stateLabel(a.state), group: "Static registry" }));
        const okAgents = agents.filter((item) => item.state === "ok").length;
        const totalAgents = agents.length;
        const attentionRows = [];

        if (!hasFeed || !isLive) {
          attentionRows.push({
            name: "Agent feed",
            state: "warn",
            detail: !hasFeed
              ? "agents-live.json이 없거나 읽히지 않습니다."
              : `마지막 수집 ${relFromMinutes(liveFeed.ageMinutes)} — 30분 신선도 기준을 넘었습니다.`,
            meta: hasFeed ? agentFresh.label : "missing",
            reason: "라이브 에이전트 피드가 신선하지 않으면 레이어와 산출물 판정은 마지막 수집 시점의 근거로만 봐야 합니다.",
          });
        }
        if (snapshotFresh.state !== "ok") {
          attentionRows.push({
            name: "Status snapshot",
            state: snapshotFresh.state,
            detail: `status.json · ${stamp(data.generatedAt)} · ${snapshotFresh.text}`,
            meta: snapshotFresh.label,
            reason: "정적 status snapshot이 오래되면 점수와 서비스 목록은 보조 근거로만 봐야 합니다.",
          });
        }
        nonOkLayers.forEach((layer, index) => {
          attentionRows.push({
            name: `L${layers.indexOf(layer) + 1 || index + 1} ${layer.name}`,
            state: layer.state,
            detail: layer.reason || LAYER_DETAIL[layer.key] || "운영 레이어 확인이 필요합니다.",
            meta: layer.state,
            reason: layer.reason || "수집기가 판정 근거를 아직 보내지 않았습니다 — 다음 수집 주기 후 다시 확인하세요.",
          });
        });
        nonOkOutputs.forEach((item) => {
          attentionRows.push({
            name: item.name,
            state: item.state,
            detail: `${relHours(item.ageHours)} · ${outputAction(item)}`,
            meta: relHours(item.ageHours),
          });
        });
        nonOkChecks.forEach((item) => {
          attentionRows.push({
            name: item.name,
            state: item.state,
            detail: item.detail || host(item.url),
            meta: item.latencyMs ? `${item.latencyMs}ms` : stateLabel(item.state),
            href: item.url,
          });
        });

        const healthySystemRows = [
          ...okLayers.map((layer, index) => ({
            name: `L${layers.indexOf(layer) + 1 || index + 1} ${layer.name}`,
            state: "ok",
            detail: LAYER_DETAIL[layer.key] || "정상 판정입니다.",
            meta: "ok",
          })),
          ...(sys ? [
            {
              name: "PDCA loop",
              state: "ok",
              detail: `Check 미해결 ${sys.pdca.checkUnresolved ?? "-"}건 · 게이트 실패(7d) ${sys.pdca.checkFailures7d ?? "-"}건 · Act 규칙 ${sys.pdca.actRules ?? "-"}개`,
              meta: "loop",
            },
            ...sys.backlogs.map((b) => ({
              name: `Backlog · ${b.name}`,
              state: b.state,
              detail: `${b.count}건 / 경고선 ${b.warnAt}건`,
              meta: `${b.count}`,
              reason: b.state === "bad"
                ? `${b.count}건 — 경고선 ${b.warnAt}건의 2배를 넘었습니다`
                : b.state === "warn"
                  ? `${b.count}건 — 경고선 ${b.warnAt}건을 넘었습니다`
                  : null,
            })),
            {
              name: "Infinity intents",
              state: "ok",
              detail: `Inbox ${sys.intents.inbox ?? "-"} · Active ${sys.intents.active ?? "-"} · Waiting ${sys.intents.waiting ?? "-"}`,
              meta: "queue",
            },
          ] : []),
        ];

        const evidenceRows = [
          { name: "Score basis", state: attentionRows.length ? "warn" : "ok", detail: `Score ${score}/100 · Services ${okChecks}/${checks.length} · Agents ${okAgents}/${totalAgents} · Outputs ${outputRatio} · Layers ${layers.length ? `${okLayers.length}/${layers.length}` : "--"}`, meta: "basis" },
          { name: "Status snapshot", state: snapshotFresh.state, detail: `status.json · ${stamp(data.generatedAt)} · ${snapshotFresh.text}`, meta: snapshotFresh.label },
          { name: "Agent feed", state: isLive ? "ok" : "warn", detail: hasFeed ? `agents-live.json · ${agentFresh.text}` : "agents-live.json · unavailable", meta: hasFeed ? agentFresh.label : "missing" },
          { name: "Coverage", state: "ok", detail: `${checks.length} surfaces, ${totalAgents} agents, ${outputs.length} outputs`, meta: "mapped" },
        ];

        const hasBad = attentionRows.some((item) => item.state === "bad");
        const displayState = attentionRows.length ? (hasBad ? "bad" : "warn") : "ok";
        const layerCount = nonOkLayers.length;
        const outputCount = nonOkOutputs.length;
        const heroLabel = attentionRows.length
          ? (sys
              ? `${layerCount}개 운영 레이어와 ${outputCount}개 산출물에서 확인이 필요합니다.`
              : "라이브 운영 피드를 먼저 확인해야 합니다.")
          : `${checks.length}개 서비스 접점과 ${totalAgents}개 에이전트가 정상적으로 신호를 보내고 있습니다.`;
        const heroLines = attentionRows.length ? ["주의 필요", "먼저 볼 신호"] : ["조용히 정상", "다음 주기 대기"];
        const nowTitle = attentionRows[0]
          ? `${attentionRows[0].name} 확인`
          : `${okChecks}/${checks.length} services`;
        const nextCollector = hasFeed ? `Agent feed ${agentFresh.text}` : "Agent feed missing";

        const grouped = (items, name) => ({ name, rows: items });
        const needsGroup = grouped(attentionRows.length ? attentionRows : [{
          name: "No attention items",
          state: "ok",
          detail: "현재 먼저 볼 문제는 없습니다.",
          meta: "clear",
        }], "Needs attention");

        return {
          generatedAt: data.generatedAt,
          overallState: displayState,
          overallLabel: heroLabel,
          heroLines,
          score,
          okChecks,
          totalChecks: checks.length,
          meta: {
            score: `보조 점수 ${score}/100`,
            stats: `Services ${okChecks}/${checks.length} · Agents ${okAgents}/${totalAgents} · Outputs ${outputRatio}`,
            updated: `Snapshot ${snapshotFresh.label} · ${relFromMinutes(snapshotAge)} / Agent ${hasFeed ? `${agentFresh.label} · ${relFromMinutes(liveFeed.ageMinutes)}` : "missing"}`,
          },
          cards: [
            {
              id: "system",
              label: "Now",
              value: attentionRows.length ? "주의 필요" : "조용히 유지",
              title: attentionRows.length ? nowTitle : "현재 할 일 없음",
              status: attentionRows.length ? `${attentionRows.length}개 신호 먼저 확인` : "다음 주기만 기다립니다",
              state: displayState,
            },
            {
              id: "agents",
              label: "Balance",
              value: `${okAgents}/${totalAgents} agents`,
              title: `${outputRatio} outputs fresh`,
              status: `Services ${okChecks}/${checks.length} 정상`,
              state: okAgents === totalAgents && okChecks === checks.length ? "ok" : "warn",
            },
            {
              id: "output",
              label: "Loop",
              value: outputCount ? "재확인 필요" : "다음 주기 대기",
              title: nextCollector,
              status: `Snapshot ${snapshotFresh.label}`,
              state: outputCount || snapshotFresh.state !== "ok" ? "warn" : "ok",
            },
          ],
          panels: {
            system: {
              title: "System Health",
              score: attentionRows.length ? "주의" : "정상",
              sub: heroLabel,
              summary: [
                ["State", attentionRows.length ? "attention" : "quiet"],
                ["Layers", layers.length ? `${okLayers.length}/${layers.length} ok` : "--"],
                ["Snapshot", snapshotFresh.label],
              ],
              groups: [
                needsGroup,
                grouped(healthySystemRows, "Healthy"),
                grouped(evidenceRows, "Evidence"),
              ],
            },
            surfaces: {
              title: "Live Surfaces",
              score: `${okChecks}/${checks.length}`,
              sub: "서비스 접점은 상태 판정의 보조 근거입니다.",
              summary: [
                ["OK", okChecks],
                ["Total", checks.length],
                ["Avg", `${avgLatency}ms`],
              ],
              groups: [
                grouped(nonOkChecks.length ? nonOkChecks.map((item) => ({
                  ...item,
                  meta: item.latencyMs ? `${item.latencyMs}ms` : stateLabel(item.state),
                  href: item.url,
                })) : [{
                  name: "All surfaces",
                  state: "ok",
                  detail: `${checks.length}개 서비스 접점이 모두 정상 응답 중입니다.`,
                  meta: "clear",
                }], "Needs attention"),
                grouped(checks.filter((item) => item.state === "ok").map((item) => ({
                  ...item,
                  meta: item.latencyMs ? `${item.latencyMs}ms` : stateLabel(item.state),
                  href: item.url,
                })), "Healthy"),
              ],
            },
            agents: {
              title: "Agents",
              score: `${okAgents}/${totalAgents}`,
              sub: hasFeed
                ? "예약 루프형과 수동 호출형을 구분해 봅니다."
                : "라이브 피드가 조용합니다 — 정적 registry 목록으로 대신 보여줍니다.",
              summary: [
                ["OK", okAgents],
                ["Agents", totalAgents],
                ["Feed", hasFeed ? agentFresh.text : "silent"],
              ],
              groups: [
                grouped(agents.filter((item) => item.group === "Scheduled"), "Scheduled"),
                grouped(agents.filter((item) => item.group !== "Scheduled"), "On demand"),
              ],
            },
            output: {
              title: "Output",
              score: !hasFeed ? "--" : `${freshOutputs}/${outputs.length}`,
              sub: hasFeed
                ? `${nonOkOutputs.length}개 산출물에서 재확인이 필요합니다.`
                : "라이브 피드가 조용합니다 — 산출물 신선도를 알 수 없습니다.",
              summary: [
                ["Fresh", hasFeed ? freshOutputs : "--"],
                ["Outputs", hasFeed ? outputs.length : "--"],
                ["Feed", hasFeed ? agentFresh.text : "silent"],
              ],
              groups: hasFeed
                ? [
                    grouped(nonOkOutputs.length ? nonOkOutputs.map((item) => ({
                      name: item.name,
                      state: item.state,
                      detail: `${relHours(item.ageHours)} · ${outputAction(item)}`,
                      meta: relHours(item.ageHours),
                    })) : [{
                      name: "All outputs",
                      state: "ok",
                      detail: "모든 산출물이 기대 주기 안에 있습니다.",
                      meta: "clear",
                    }], "Needs attention"),
                    grouped(outputs.filter((item) => item.state === "ok").map((item) => ({
                      name: item.name,
                      state: item.state,
                      detail: `${relHours(item.ageHours)} · ${outputAction(item)}`,
                      meta: relHours(item.ageHours),
                    })), "Fresh"),
                  ]
                : [grouped([{
                    name: "Live feed silent",
                    state: "warn",
                    detail: "agents-live.json이 없거나 오래됐습니다 — 수집기 신호를 확인하세요.",
                    meta: "stale",
                  }], "Needs attention")],
            },
          },
        };
      }

      function renderPanels() {
        Object.entries(model.panels).forEach(([id, panel]) => {
          const groups = (panel.groups || [{ name: "Details", rows: panel.rows || [] }])
            .filter((group) => (group.rows || []).length > 0);
          $(`panel-${id}`).innerHTML = `
            <div class="summary-strip">
              ${panel.summary.map(([key, value]) => summaryTile(key, value)).join("")}
            </div>
            ${groups.map((group) => `
              <div class="group-title${group.name === "Needs attention" ? " is-attention" : ""}">${safe(group.name)}</div>
              <div class="list-stack">
                ${(group.rows || []).map((item) => row(item, item.meta, item.href)).join("")}
              </div>
            `).join("")}
          `;
        });
      }

      function setTab(id) {
        currentTab = id;
        const panel = model.panels[id];
        if (!panel) return;

        flash();
        document.body.dataset.mode = "detail";
        $("detailTitle").textContent = panel.title;
        $("detailSub").textContent = panel.sub;
        $("detailScore").textContent = panel.score;
        $("detailScroll").scrollTop = 0;

        document.querySelectorAll(".detail-panel").forEach((el) => {
          el.classList.toggle("is-current", el.id === `panel-${id}`);
        });
        document.querySelectorAll(".nav-button").forEach((el) => {
          el.classList.toggle("is-current", el.dataset.tab === id);
        });
        document.querySelectorAll(".control-card").forEach((el) => {
          el.classList.toggle("is-active", el.dataset.tab === id);
        });
      }

      function heroLines(state, okChecks, totalChecks) {
        if (state === "ok") return ["All systems", "quiet & running"];
        if (state === "warn") return ["Some signals", "need attention"];
        return [`${totalChecks - okChecks} surfaces`, "are down now"];
      }

      function startSaemScene(mood) {
        // Status now uses the user's mascot image as its spatial layer.
        // Keep the hook so the status-data render contract remains unchanged.
        document.body.dataset.scene = "mascot-image";
      }

      function render(data, liveFeed) {
        model = buildModel(data, liveFeed);
        const [lineOne, lineTwo] = model.heroLines || heroLines(model.overallState, model.okChecks, model.totalChecks);
        document.body.dataset.overall = model.overallState;
        $("heroKicker").textContent = "Space status";
        $("heroLineOne").textContent = lineOne;
        $("heroLineTwo").textContent = lineTwo;
        $("heroLead").textContent = model.overallLabel;
        $("heroMetaScore").innerHTML = `<strong>State</strong> / ${safe(model.meta.score)}`;
        $("heroMetaStats").innerHTML = `<strong>Signals</strong> / ${safe(model.meta.stats)}`;
        $("updatedAt").innerHTML = `<strong>Freshness</strong> / ${safe(model.meta.updated)}`;
        $("overviewGrid").innerHTML = model.cards.map(card).join("");
        $("floatingNav").innerHTML = [
          `
            <button class="nav-button is-home" type="button" data-action="home" aria-label="Home">
              <span class="nav-button-label">Home</span>
            </button>
          `,
          ...tabs.map((tab) => `
            <button class="nav-button" type="button" data-tab="${tab.id}" aria-label="${tab.label}">
              <span class="nav-button-label">${tab.label}</span>
            </button>
          `),
        ].join("");

        renderPanels();

        document.querySelectorAll(".control-card").forEach((el) => {
          el.addEventListener("click", () => setTab(el.dataset.tab));
        });
        document.querySelectorAll(".nav-button").forEach((el) => {
          el.addEventListener("click", () => {
            if (el.dataset.action === "home") {
              flash();
              document.body.dataset.mode = "overview";
              return;
            }
            setTab(el.dataset.tab);
          });
        });
        $("backButton").addEventListener("click", () => {
          flash();
          document.body.dataset.mode = "overview";
        });

        applyReveal($("heroCopy"));
        startSaemScene(model.overallState);
      }

      $("reasonClose").addEventListener("click", closeReason);
      $("reasonModal").addEventListener("click", (event) => {
        if (event.target === $("reasonModal")) closeReason();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeReason();
        if (event.key !== "Tab" || !$("reasonModal").classList.contains("is-open")) return;
        const focusables = [...$("reasonModal").querySelectorAll("button, [href], [tabindex]:not([tabindex='-1'])")]
          .filter((el) => !el.disabled);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
      document.addEventListener("click", (event) => {
        const el = event.target.closest(".list-row.is-clickable");
        if (el) openReason(el.dataset, el);
      });

      document.addEventListener("pointerdown", (event) => {
        if (document.body.dataset.scene === "webgl") return;
        if (event.target.closest("button, a")) return;
        const fallback = document.querySelector(".saem-fallback");
        const pebble = fallback.querySelector(".pebble");
        const rect = fallback.getBoundingClientRect();
        const pad = 30;
        const inside =
          event.clientX > rect.left - pad &&
          event.clientX < rect.right + pad &&
          event.clientY > rect.top - pad &&
          event.clientY < rect.bottom + pad;
        if (!inside) return;
        pebble.classList.remove("is-poked");
        void pebble.offsetWidth;
        pebble.classList.add("is-poked");
      });

      document.querySelector(".saem-fallback .pebble").addEventListener("animationend", (event) => {
        if (event.animationName === "saemPoke") event.target.classList.remove("is-poked");
      });

      Promise.all([
        fetch("./status.json", { cache: "no-store" }).then((response) => response.json()),
        loadAgentsLive(),
      ])
        .then(([data, liveFeed]) => render(data, liveFeed))
        .catch(() => {
          document.body.dataset.overall = "warn";
          $("heroLineTwo").textContent = "feed unavailable";
          $("heroMetaScore").innerHTML = "<strong>Score</strong> / --";
          $("heroMetaStats").innerHTML = "<strong>Surfaces</strong> / waiting";
          $("updatedAt").innerHTML = "<strong>Updated</strong> / unavailable";
          $("overviewGrid").innerHTML = card({
            id: "system",
            label: "System",
            value: "--",
            title: "waiting",
            status: "status.json unavailable",
            state: "warn",
          });
          applyReveal($("heroCopy"));
          startSaemScene("warn");
        });
    </script>
  </body>
</html>
